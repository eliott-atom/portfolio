<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOVE IS LOVE IS LOVE</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100vw; height: 100vh;
      overflow: hidden; background: #000;
      color: #000; font-family: 'Times New Roman', Times, serif;
    }

    #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

    /* =========================================
       DEPTH 0: PRESTIGE TRAILER STYLES
       ========================================= */
    #trailer-view {
      position: absolute; inset: 0;
      background: #000; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 10;
    }

    #p-trailer {
      position: absolute; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    #loading-curtain {
      position: absolute; inset: 0;
      background: #000; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 1.2s ease;
    }

    #enter-btn {
      padding: 18px 42px; font-size: 1.8rem;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em;
      background-color: #ff1493; color: white;
      border: none; border-radius: 50px; cursor: pointer;
      opacity: 0; transform: scale(0.92);
      transition: opacity 0.8s ease, transform 0.2s ease, background-color 0.2s ease;
    }
    #enter-btn:hover { background-color: #ff69b4; transform: scale(0.98); }

    #p-learn-more {
      position: absolute; bottom: 8vh; left: 50%;
      transform: translateX(-50%); font-size: 1.1rem;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: #fff; text-decoration: none; cursor: pointer;
      opacity: 0; pointer-events: none;
      transition: opacity 1.5s ease; z-index: 15;
      text-shadow: 0px 2px 10px rgba(0,0,0,0.8);
      border-bottom: 1px solid rgba(255,255,255,0.4);
      padding-bottom: 4px;
    }
    #p-learn-more.visible { opacity: 1; pointer-events: auto; }

    /* =========================================
       DEPTH 1+: 90s NCSA MOSAIC / REFUGE STYLES
       ========================================= */
    #void-underbelly {
      position: fixed; inset: 0; background: #050505;
      z-index: 0; overflow: hidden;
    }

    #browser-frame {
      position: relative; z-index: 10;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      background: #c0c0c0; border: 3px outset #fff;
      overflow: hidden; transition: transform 0.5s ease, filter 0.5s ease;
    }

    /* 90s Browser Chrome */
    .browser-menu-bar {
      display: flex; gap: 15px; padding: 3px 8px;
      font-family: 'MS Sans Serif', Tahoma, sans-serif; font-size: 11px;
      background: #c0c0c0; border-bottom: 1px solid #808080; user-select: none;
    }
    .browser-toolbar {
      display: flex; align-items: center; gap: 4px; padding: 4px 6px;
      background: #c0c0c0; border-bottom: 2px groove #fff;
    }
    .retro-btn {
      padding: 3px 10px; font-size: 11px;
      font-family: 'MS Sans Serif', Tahoma, sans-serif;
      background: #c0c0c0; border: 2px outset #fff; cursor: pointer;
    }
    .retro-btn:active { border: 2px inset #fff; }
    .url-bar-wrap {
      display: flex; align-items: center; gap: 6px; padding: 3px 8px;
      background: #c0c0c0; border-bottom: 2px groove #fff;
      font-family: 'MS Sans Serif', Tahoma, sans-serif; font-size: 12px;
    }
    .url-input {
      flex-grow: 1; background: #fff; border: 2px inset #808080;
      padding: 2px 6px; font-family: monospace; font-size: 12px;
      color: #000;
    }

    /* 90s Web Page Body */
    #page-viewport {
      flex-grow: 1; overflow-y: auto; overflow-x: hidden;
      background-color: #8fa396;
      background-image: url('bg-tile.png');
      background-repeat: repeat;
      padding: 25px; display: flex; flex-direction: column; align-items: center;
    }

    .mosaic-card {
      max-width: 820px; width: 100%; background: #ffffffd8;
      border: 3px double #4a6351; padding: 30px 40px;
      box-shadow: 6px 6px 0px rgba(0,0,0,0.25);
      text-align: center; position: relative;
    }

    .hotel-logo-header {
      display: flex; align-items: center; justify-content: center; gap: 20px;
      margin-bottom: 15px; border-bottom: 2px groove #808080; padding-bottom: 15px;
    }
    .hotel-title-text h1 {
      font-size: 2.3rem; letter-spacing: 0.05em; font-weight: normal;
      color: #1a3322; font-style: italic;
    }
    .hotel-title-text p {
      font-size: 0.95rem; letter-spacing: 0.2em; text-transform: uppercase; color: #444;
    }

    /* Shaw-Festival style collage wheel */
    .wheel-container {
      position: relative; width: 260px; height: 260px;
      margin: 20px auto; border-radius: 50%;
      border: 3px dashed #35523f;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle, #e3ede6 0%, #a4bcae 100%);
    }
    .wheel-center-disc {
      width: 90px; height: 90px; border-radius: 50%;
      background: #23382b; color: #f0e68c;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; text-align: center; border: 2px solid #fff;
    }
    .cutout-node {
      position: absolute; width: 52px; height: 52px;
      object-fit: cover; border-radius: 4px;
      border: 1px solid #1a3322; filter: contrast(110%);
    }

    /* Reserve One icon row */
    .amenity-icon-strip {
      display: flex; justify-content: center; gap: 12px;
      margin: 20px 0; padding: 6px;
      border-top: 1px solid #708577; border-bottom: 1px solid #708577;
    }
    .badge-icon {
      width: 32px; height: 32px; border: 1px inset #808080;
      background: #e8eee9; display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .room-schedule-table {
      width: 100%; border-collapse: collapse; margin: 20px 0;
      font-family: 'Times New Roman', serif; font-size: 0.95rem;
    }
    .room-schedule-table th {
      background: #2a4734; color: #fff; padding: 6px 10px; border: 1px solid #1a3322;
    }
    .room-schedule-table td {
      padding: 6px 10px; border: 1px solid #708577; background: #fff;
    }

    .reserve-cta {
      margin-top: 15px; padding: 10px 30px;
      font-family: 'MS Sans Serif', Tahoma, sans-serif; font-weight: bold;
      font-size: 1rem; color: #000; background: #d4d0c8;
      border: 3px outset #fff; cursor: pointer;
    }
    .reserve-cta:hover { background: #e0ded8; }
    .reserve-cta:active { border: 3px inset #fff; }

    /* =========================================
       GENERATIVE DECAY INJECTIONS (Depth 2+)
       ========================================= */
    .void-video {
      position: absolute; object-fit: cover;
      pointer-events: none; z-index: 1;
    }
    .void-still {
      position: absolute; object-fit: cover;
      pointer-events: none; z-index: 2;
    }
  </style>
</head>
<body>

  <div id="stage"></div>

  <script>
    // 1. Session redirect recovery for GitHub Pages 404 router
    const savedPath = sessionStorage.getItem('redirect_path');
    if (savedPath) {
      sessionStorage.removeItem('redirect_path');
      window.history.replaceState(null, '', savedPath);
    }

    const stage = document.getElementById('stage');

    // 2. Base directory resolver
    function getBasePath() {
      let path = window.location.pathname.replace(/index\.html$/i, '');
      path = path.replace(/\/love(-is-love)*\/?$/i, '/');
      if (!path.endsWith('/')) path += '/';
      return path;
    }

    // 3. Extract depth from URL (depth 0 = /movie/love, 1 = /movie/love-is-love, etc.)
    function getDepth() {
      const matches = window.location.pathname.match(/is-love/g);
      return matches ? matches.length : 0;
    }

    // 4. Seeded PRNG (Stateful Mulberry32)
    function createPRNG(seed) {
      let s = (seed >>> 0) || 1;
      return function() {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Navigation trigger
    function advanceToNextDepth() {
      const nextDepth = getDepth() + 1;
      const basePath = getBasePath();
      const nextSlug = "love" + "-is-love".repeat(nextDepth);
      window.history.pushState({ depth: nextDepth }, '', basePath + nextSlug);
      render();
    }

    // =========================================
    // VIEW 0: PRESTIGE TRAILER
    // =========================================
    function renderDepth0() {
      stage.innerHTML = `
        <div id="trailer-view">
          <video id="p-trailer" playsinline preload="auto" src="trailer.mp4"></video>
          <div id="loading-curtain">
            <button id="enter-btn">Press to enter love</button>
          </div>
          <div id="p-learn-more">Learn More</div>
        </div>
      `;

      const video = document.getElementById('p-trailer');
      const curtain = document.getElementById('loading-curtain');
      const enterBtn = document.getElementById('enter-btn');
      const learnMore = document.getElementById('p-learn-more');

      const LEARN_MORE_SECONDS = 5;
      const LOOP_TAIL = 10;

      video.addEventListener('loadeddata', () => {
        enterBtn.style.opacity = '1';
        enterBtn.style.transform = 'scale(1)';
      });

      // User gesture bypasses browser unmuted autoplay block
      enterBtn.addEventListener('click', () => {
        curtain.style.opacity = '0';
        setTimeout(() => { curtain.style.display = 'none'; }, 1200);
        video.play();
      });

      video.addEventListener('timeupdate', () => {
        if (video.currentTime >= LEARN_MORE_SECONDS && !learnMore.classList.contains('visible')) {
          learnMore.classList.add('visible');
        }
      });

      video.addEventListener('ended', () => {
        video.currentTime = Math.max(0, video.duration - LOOP_TAIL);
        video.play();
      });

      learnMore.addEventListener('click', advanceToNextDepth);
    }

    // =========================================
    // VIEW 1+: 90s REFUGE & FRACTURE ENGINE
    // =========================================
    function renderRefugeEngine(depth) {
      if (window.videoGlitchTimer) clearInterval(window.videoGlitchTimer);

      const D = depth - 1; // D = 0 is pristine 90s; D >= 1 begins tearing
      const rng = createPRNG(depth * 9973 + 43);

      stage.innerHTML = `
        <div id="void-underbelly"></div>

        <div id="browser-frame">
          <!-- Mosaic Chrome -->
          <div class="browser-menu-bar">
            <span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span>
            <span><u>N</u>avigate</span><span><u>H</u>otlists</span><span><u>H</u>elp</span>
          </div>

          <div class="browser-toolbar">
            <button class="retro-btn">Back</button>
            <button class="retro-btn">Forward</button>
            <button class="retro-btn">Home</button>
            <button class="retro-btn">Reload</button>
            <button class="retro-btn">Print</button>
            <button class="retro-btn" style="margin-left:auto;">Mosaic 2.1</button>
          </div>

          <div class="url-bar-wrap">
            <span>Location:</span>
            <input type="text" class="url-input" readonly 
              value="http://www.refuge-hotel.res/admissions${'-is-love'.repeat(depth)}.htm">
          </div>

          <!-- Page Content -->
          <div id="page-viewport">
            <div class="mosaic-card" id="main-card">
              
              <div class="hotel-logo-header">
                <img src="hotel-crest.png" onerror="this.style.display='none'" style="width:58px;height:58px;" alt="Crest">
                <div class="hotel-title-text">
                  <h1 id="dyn-headline">The Refuge Hotel & Recovery</h1>
                  <p id="dyn-sub">A Sanctuary of Quietude & Structured Amnesia</p>
                </div>
              </div>

              <!-- Wheel of Hospitality -->
              <div class="wheel-container" id="wheel-frame">
                <div class="wheel-center-disc">AMENITIES<br>& ADMISSION</div>
                <img src="cutout-1.png" onerror="this.src='movie-1.webp'" class="cutout-node" style="top:10px; left:104px;" alt="">
                <img src="cutout-2.png" onerror="this.src='movie-2.webp'" class="cutout-node" style="top:104px; right:10px;" alt="">
                <img src="cutout-3.png" onerror="this.src='movie-3.webp'" class="cutout-node" style="bottom:10px; left:104px;" alt="">
                <img src="cutout-4.png" onerror="this.src='movie-4.webp'" class="cutout-node" style="top:104px; left:10px;" alt="">
              </div>

              <!-- Pixel Row -->
              <div class="amenity-icon-strip">
                <div class="badge-icon">👁</div>
                <div class="badge-icon">🗝</div>
                <div class="badge-icon">🛏</div>
                <div class="badge-icon">⌛</div>
                <div class="badge-icon">🔇</div>
              </div>

              <p id="dyn-blurb" style="line-height:1.6; margin: 15px 0; font-size:1.05rem;">
                Welcome to The Refuge. Nestled beyond active recollection, our hermetic suites offer 
                twenty-four hour structural surveillance, continuous acoustic scrubbing, and full 
                cleansing baths. Inhabitants are guaranteed non-communicative solitude.
              </p>

              <table class="room-schedule-table">
                <thead>
                  <tr>
                    <th>Suite / Unit</th>
                    <th>Intervention Tier</th>
                    <th>Current Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr id="row-101"><td>Suite 101</td><td>Acoustic Isolation</td><td>VACANT</td></tr>
                  <tr id="row-104"><td>Suite 104</td><td>Deep Submersion</td><td style="color:#800000;font-weight:bold;">OCCUPIED</td></tr>
                  <tr id="row-109"><td>Cellar Level</td><td>Amnestic Bath</td><td>SCHEDULED</td></tr>
                </tbody>
              </table>

              <button class="reserve-cta" id="hotel-cta">SUBMIT ADMISSION REQUEST</button>
            </div>
          </div>
        </div>
      `;

      const browserFrame = document.getElementById('browser-frame');
      const mainCard = document.getElementById('main-card');
      const voidUnderbelly = document.getElementById('void-underbelly');
      const cta = document.getElementById('hotel-cta');

      cta.addEventListener('click', advanceToNextDepth);

      // --- DEPTH 1 (D = 0): Pristine state ---
      if (D === 0) return;

      // =========================================
      // DEPTH 2+ (D >= 1): CRACKS AND SEEPAGE
      // =========================================

      // 1. Structural tilt and wallpaper tearing
      const tilt = ((rng() - 0.5) * D * 3.5).toFixed(2);
      browserFrame.style.transform = `rotate(${tilt}deg)`;

      // Tear an irregular hole out of the 90s browser card to reveal the void underneath
      const tearY = Math.floor(45 + rng() * 25);
      browserFrame.style.clipPath = `polygon(
        0% 0%, 100% 0%, 
        100% ${tearY}%, 
        ${85 + rng() * 10}% ${tearY + 6}%, 
        ${50 + rng() * 10}% ${tearY - 4}%, 
        ${20 + rng() * 10}% ${tearY + 7}%, 
        0% ${tearY}%
      )`;

      // 2. Inject film still peeking behind the torn wall
      const still = document.createElement('img');
      const stillIdx = Math.floor(1 + rng() * 11);
      still.src = `movie-${stillIdx}.webp`;
      still.className = 'void-still';
      still.style.width = `${22 + D * 7}vw`;
      still.style.bottom = `${3 + rng() * 8}vh`;
      still.style.right = `${5 + rng() * 15}vw`;
      still.style.filter = `contrast(${110 + D * 20}%) hue-rotate(${Math.floor(rng() * 360)}deg)`;
      still.style.opacity = Math.min(1, 0.5 + D * 0.2);
      voidUnderbelly.appendChild(still);

      // Table row begins corrupting
      const row = document.getElementById('row-104');
      if (row) {
        row.style.background = '#000';
        row.style.color = '#ff1493';
        row.children[2].innerText = "RECURSION ERROR";
      }

      // --- DEPTH 3+ (D >= 2): TRAILER BLEEDTHROUGH ---
      if (D >= 2) {
        const vid = document.createElement('video');
        vid.src = 'trailer.mp4';
        vid.autoplay = true;
        vid.muted = true;
        vid.loop = true;
        vid.playsInline = true;
        vid.className = 'void-video';

        const vWidth = Math.min(65, 30 + D * 8);
        vid.style.width = `${vWidth}vw`;
        vid.style.height = `${vWidth * 0.56}vw`;
        vid.style.bottom = `${10 + (rng() - 0.5) * 10}%`;
        vid.style.left = `${4 + rng() * 10}%`;
        vid.style.border = '2px solid #ff1493';
        vid.style.filter = `hue-rotate(${Math.floor(rng() * 360)}deg) contrast(${130 + D * 30}%)`;
        vid.style.transform = `rotate(${((rng() - 0.5) * 16).toFixed(1)}deg)`;
        
        // Playback warping
        vid.playbackRate = rng() > 0.5 ? Math.max(0.2, 1.0 - D * 0.15) : Math.min(3.0, 1.0 + D * 0.3);
        voidUnderbelly.appendChild(vid);

        // Stammering and broken copy
        document.getElementById('dyn-headline').innerText = "The Refuge (Compromised)";
        document.getElementById('dyn-sub').innerText = "Memory scrubbing failed. The occupant remains in 104.";
        mainCard.style.transform = `skew(${((rng() - 0.5) * D * 4).toFixed(1)}deg)`;
        cta.innerText = "FORCE PURGE / DESCEND";
      }

      // --- DEPTH 4+ (D >= 3): TOTAL DISSOLUTION ---
      if (D >= 3) {
        // Second movie still invades directly on top of the 90s text card
        const intrusiveImg = document.createElement('img');
        intrusiveImg.src = `movie-${Math.floor(1 + rng() * 11)}.webp`;
        intrusiveImg.style.position = 'absolute';
        intrusiveImg.style.top = `${15 + rng() * 25}%`;
        intrusiveImg.style.left = `${10 + rng() * 35}%`;
        intrusiveImg.style.width = `${24 + D * 4}vw`;
        intrusiveImg.style.mixBlendMode = rng() > 0.5 ? 'difference' : 'exclusion';
        intrusiveImg.style.zIndex = '30';
        intrusiveImg.style.pointerEvents = 'none';
        mainCard.appendChild(intrusiveImg);

        // Text breaks into film loop themes
        document.getElementById('dyn-blurb').innerText = 
          "LOVE IS LOVE IS LOVE. THE LOOP DOES NOT EXPEL. ROOM 104 IS EXPANDING INTO THE CORRIDORS.";
        document.getElementById('dyn-blurb').style.color = '#b00';
        cta.innerText = "DECOMPOSE FURTHER";
      }
    }

    // =========================================
    // MAIN DISPATCHER
    // =========================================
    function render() {
      const depth = getDepth();
      if (depth === 0) {
        renderDepth0();
      } else {
        renderRefugeEngine(depth);
      }
    }

    window.addEventListener('popstate', render);
    render();
  </script>
</body>
</html>
