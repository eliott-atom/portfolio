<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome</title>
    <link rel="icon" type="image/png" href="favicon-light.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;900&display=swap" rel="stylesheet">
    <script>
        if (window.location.pathname.endsWith('.html')) {
            let clean = window.location.pathname.replace(/\/index\.html$/, '/').replace(/\.html$/, '');
            if (!clean) clean = '/';
            window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden; 
        }

        body {
            background-color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 500;
            font-size: 20px;
        }

        #content-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #000000;
            z-index: 1;
            transition: background-color 0.8s ease, filter 0.8s linear; 
        }

        #content-layer.theme-white {
            background-color: #ffffff;
        }

        #content-layer.theme-inverted {
            filter: invert(1);
        }

        .corner-link {
            position: fixed;
            z-index: 10; 
            padding: 4vw; 
            text-decoration: none;
            text-transform: lowercase;
            color: #000000; 
            transition: color 0.15s ease;
            pointer-events: none; 
        }

        .corner-link:hover,
        .corner-link.is-active {
            font-weight: 900;
            color: #ff00ff; 
        }

        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; text-align: right; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; text-align: right; }

        div.grid-wrapper {
            display: grid;
            width: 100%;
            height: 100%;
            height: 100dvh;
            place-items: center; 
            position: relative; 
        }

        img, video {
            width: 75%;
            max-width: 500px;
            max-width: min(500px, 75dvh);
            display: block;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            object-position: center;
            grid-area: 1 / 1;
        }

        /* Curseur spécifique pour la tête pour indiquer qu'elle est cliquable */
        #head-idle {
            cursor: pointer;
            z-index: 2;
        }

        .interactive-video {
            z-index: 3;
        }

        #head-idle, #vid-reveil, .interactive-video {
            display: none;
        }
        #vid-reveil {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* --- BULLE DE DIALOGUE EASTER EGG --- */
        #speech-bubble {
            position: absolute;
            top: 25%;
            left: 55%; /* Se place en haut à droite de la tête */
            max-width: 250px;
            background-color: #ff00ff;
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 30px 30px 30px 5px; /* Forme de bulle */
            font-family: "Libre Franklin", sans-serif;
            font-weight: 900;
            font-size: 16px;
            line-height: 1.2;
            z-index: 20;
            pointer-events: none;
            
            /* Animation de base (cachée) */
            opacity: 0;
            transform: scale(0);
            transform-origin: bottom left; 
            transition: opacity 0.2s ease, transform 0s ease; /* Transform à 0s pour reset instantané */
        }

        /* État actif de la bulle (effet rebond élastique) */
        #speech-bubble.show {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.2s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* LE TITRE */
        #main-title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 900;
            font-size: 6vw; 
            line-height: 1; 
            text-align: center; 
            text-transform: lowercase;
            color: #ffffff;
            mix-blend-mode: difference; 
            pointer-events: none; 
            z-index: 10000;
            white-space: pre; 
            transition: top 1.2s ease-in-out, left 1.2s ease-in-out, transform 1.2s ease-in-out, font-size 1.2s ease-in-out;
        }
        #main-title.move-to-header {
            top: 2vw;
            left: 4vw;
            transform: translate(0, 0); 
            font-size: 26px; 
            text-align: left;
        }

        /* L'ÉCRAN NOIR FINAL */
        #black-overlay {
            position: fixed;
            inset: 0;
            background-color: #000000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease; 
        }
        #black-overlay.show {
            opacity: 1;
        }
        /* --- ADAPTATION MOBILE (Par ratio écran, alignée sur content.html) --- */
        @media (max-aspect-ratio: 4/5) {
            #main-title {
                font-size: 12vw; /* Rend le texte 2x plus gros sur téléphone */
            }
            
            #main-title.move-to-header {
                top: 2vw; /* Aligné sur le top: 2vw de content.html */
                left: 4vw;
                font-size: 15.6px; /* 1.2em * 13px de content.html */
            }
        }

        /* MINIMALIST LANG SWITCH (EN / FR) */
        .lang-switch {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            padding-bottom: 4vw;
            z-index: 25;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 20px;
            font-weight: 500;
            text-transform: lowercase;
            color: #000000;
            display: flex;
            align-items: baseline;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            opacity: 0;
        }

        .lang-switch.is-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .lang-switch .lang-item {
            color: #000000;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease, font-weight 0.15s ease;
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .lang-switch .lang-item.is-active {
            font-weight: 900 !important;
            color: #000000;
            cursor: default;
            pointer-events: none;
        }

        .lang-switch a.lang-item:hover {
            color: #ff00ff;
            font-weight: 900;
        }

        .lang-switch .lang-sep {
            color: #000000;
            font-weight: 500;
            cursor: default;
            pointer-events: none;
            user-select: none;
        }

        .lang-switch .lang-underline {
            position: absolute !important;
            bottom: calc(4vw - 3px);
            left: 0;
            height: 2px;
            background-color: #000000;
            pointer-events: none;
            opacity: 0;
            border-radius: 1px;
            transform: translateX(0);
            transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), width 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease;
            display: block !important;
        }
    </style>
</head>
<body>

    <div id="black-overlay"></div>

    <!-- BOUTONS -->
    <a href="portfolio" class="corner-link top-left" id="btn-index"></a>
    <a href="info" class="corner-link top-right" id="btn-info"></a>
    <a href="cv" class="corner-link bottom-left" id="btn-cv"></a>
    <a href="contact" class="corner-link bottom-right" id="btn-contact"></a>

    <!-- SÉLECTEUR DE LANGUE (EN / FR) -->
    <nav id="lang-switch" class="lang-switch" aria-label="Language selection">
        <span class="lang-item is-active" id="lang-item-en" aria-current="page">en</span><span class="lang-sep">/</span><a href="index_fr.html?return=true" id="lang-link-fr" class="lang-item">fr</a>
        <span class="lang-underline" id="lang-underline"></span>
    </nav>

    <div id="content-layer">
        <div class="grid-wrapper">
            
            <video id="vid-reveil" preload="auto" muted playsinline>
                <source src="reveil.mp4" type="video/mp4">
            </video>

            <img id="head-idle" src="tete-centre.webp" alt="Intro Animation">
            
            <!-- LA BULLE DE DIffALOGUE -->
            <div id="speech-bubble"></div>
            
            <video id="vid-top-left" class="interactive-video" poster="tete-centre.webp" preload="auto" muted playsinline>
                <source src="regarde-haut-gauche.mp4" type="video/mp4">
            </video>
            <video id="vid-top-right" class="interactive-video" poster="tete-centre.webp" preload="auto" muted playsinline>
                <source src="regarde-haut-droite.mp4" type="video/mp4">
            </video>
            <video id="vid-bottom-left" class="interactive-video" poster="tete-centre.webp" preload="auto" muted playsinline>
                <source src="regarde-bas-gauche.mp4" type="video/mp4">
            </video>
            <video id="vid-bottom-right" class="interactive-video" poster="tete-centre.webp" preload="auto" muted playsinline>
                <source src="regarde-bas-droite.mp4" type="video/mp4">
            </video>

        </div>
    </div> 

    <div id="main-title"></div>

    <script>
        let isTransitioning = false;
        let animationCycle = 0;
        let activeTimeouts = [];
        let bubbleTypeTimeout;
        let lastPhraseIndex = -1;

        const linksData = [
            { id: 'btn-index', text: 'portfolio' },
            { id: 'btn-info', text: 'love is love is love' },
            { id: 'btn-cv', text: 'cv' },
            { id: 'btn-contact', text: 'contact' }
        ];

        function registerTimeout(fn, delay) {
            const id = setTimeout(fn, delay);
            activeTimeouts.push(id);
            return id;
        }

        function clearAllTimeouts() {
            activeTimeouts.forEach(t => clearTimeout(t));
            activeTimeouts = [];
            clearTimeout(bubbleTypeTimeout);
        }

        // MACHINE À ÉCRIRE AVEC SÉCURITÉ DE CYCLE
        function typeWriterIn(element, text, speed, cycle, callback) {
            let i = 0;
            function type() {
                if (cycle !== animationCycle) return;
                let visiblePart = text.substring(0, i);
                let hiddenPart = text.substring(i);
                
                element.innerHTML = visiblePart + '<span style="visibility: hidden;">' + hiddenPart + '</span>';
                
                if (i < text.length) {
                    i++;
                    registerTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        function typeWriterOut(element, speed, callback) {
            let text = (element.id === 'main-title') 
                ? 'eliott atom\ncroubalian' 
                : (element.textContent || element.innerText); 
            let i = text.length;

            function untype() {
                let visiblePart = text.substring(0, i);
                let hiddenPart = text.substring(i);

                element.innerHTML = visiblePart + '<span style="visibility: hidden;">' + hiddenPart + '</span>';

                if (i > 0) {
                    i--;
                    registerTimeout(untype, speed);
                } else if (callback) {
                    element.innerHTML = ''; 
                    callback();
                }
            }
            untype();
        }

        function renderLangSwitchHtml(charsVisible) {
            let enVis = Math.max(0, Math.min(2, charsVisible));
            let enHid = 2 - enVis;
            let sepVis = (charsVisible >= 3) ? 1 : 0;
            let frVis = Math.max(0, Math.min(2, charsVisible - 3));
            let frHid = 2 - frVis;

            let enText = 'en';
            let frText = 'fr';

            let html = '';
            // en part (active on index.html)
            html += '<span class="lang-item is-active" id="lang-item-en" aria-current="page">';
            if (enVis > 0) html += enText.substring(0, enVis);
            if (enHid > 0) html += '<span style="visibility: hidden;">' + enText.substring(enVis) + '</span>';
            html += '</span>';

            // sep part
            html += '<span class="lang-sep">';
            if (sepVis > 0) html += '/';
            else html += '<span style="visibility: hidden;">/</span>';
            html += '</span>';

            // fr part (link on index.html)
            html += '<a href="index_fr.html?return=true" id="lang-link-fr" class="lang-item">';
            if (frVis > 0) html += frText.substring(0, frVis);
            if (frHid > 0) html += '<span style="visibility: hidden;">' + frText.substring(frVis) + '</span>';
            html += '</a>';

            html += '<span class="lang-underline" id="lang-underline"></span>';

            return html;
        }

        function typeWriterLangIn(cycle, callback) {
            const el = document.getElementById('lang-switch');
            if (!el) return;
            el.classList.add('is-visible');
            let i = 0;
            function type() {
                if (cycle !== animationCycle) return;
                el.innerHTML = renderLangSwitchHtml(i);
                if (i < 5) {
                    i++;
                    registerTimeout(type, 60);
                } else {
                    const active = document.getElementById('lang-item-en');
                    if (active) positionLangUnderline(active, true);
                    if (callback) callback();
                }
            }
            type();
        }

        function typeWriterLangOut(speed, callback) {
            const el = document.getElementById('lang-switch');
            const underline = document.getElementById('lang-underline');
            if (underline) underline.style.opacity = '0';
            if (!el) {
                if (callback) callback();
                return;
            }
            let i = 5;
            function untype() {
                el.innerHTML = renderLangSwitchHtml(i);
                const u = document.getElementById('lang-underline');
                if (u) u.style.opacity = '0';
                if (i > 0) {
                    i--;
                    registerTimeout(untype, speed || 25);
                } else {
                    el.innerHTML = '';
                    el.classList.remove('is-visible');
                    if (callback) callback();
                }
            }
            untype();
        }

        // CYCLE D'INTRODUCTION COMPLET ET RÉINITIALISABLE
        function startIntroSequence() {
            clearAllTimeouts();
            animationCycle++;
            const currentCycle = animationCycle;

            // Enregistre que l'intro a été initiée dans cette session
            try {
                sessionStorage.setItem('introPlayed', 'true');
            } catch (e) {}

            // 1. Déverrouille les clics et le rideau noir
            isTransitioning = false;
            document.body.style.pointerEvents = 'auto';

            const overlay = document.getElementById('black-overlay');
            overlay.style.transition = 'none';
            overlay.classList.remove('show');
            overlay.style.opacity = '0';
            void overlay.offsetWidth;
            overlay.style.transition = '';

            // 2. Réinitialise le conteneur principal
            const contentLayer = document.getElementById('content-layer');
            contentLayer.style.transition = 'none';
            contentLayer.classList.remove('theme-white', 'theme-inverted');
            void contentLayer.offsetWidth;
            contentLayer.style.transition = '';

            // 3. Masque et stoppe toutes les vidéos
            document.querySelectorAll('.interactive-video').forEach(vid => {
                vid.pause();
                vid.currentTime = 0;
                vid.style.display = 'none';
            });

            const vidReveil = document.getElementById('vid-reveil');
            vidReveil.pause();
            vidReveil.currentTime = 0;
            vidReveil.style.opacity = '0';
            vidReveil.style.display = 'none';

            // 4. Masque la tête idle et la bulle
            document.getElementById('head-idle').style.display = 'none';
            const bubble = document.getElementById('speech-bubble');
            bubble.classList.remove('show');
            bubble.innerHTML = '';
            bubble.style.display = '';

            const langWrap = document.getElementById('lang-switch');
            if (langWrap) {
                langWrap.classList.remove('is-visible');
                langWrap.innerHTML = '';
                langWrap.style.pointerEvents = 'none';
            }

            // 5. Réinitialise le titre et les boutons de coin
            const titleEl = document.getElementById('main-title');
            titleEl.style.transition = 'none';
            titleEl.classList.remove('move-to-header');
            titleEl.innerHTML = '';
            void titleEl.offsetWidth;
            titleEl.style.transition = '';

            linksData.forEach(link => {
                const el = document.getElementById(link.id);
                if (el) {
                    el.classList.remove('is-active');
                    el.innerHTML = '';
                    el.style.pointerEvents = 'none';
                }
            });

            // 6. Lance le déroulement temporel
            registerTimeout(() => {
                if (currentCycle !== animationCycle) return;
                contentLayer.classList.add('theme-white');
            }, 200);

            registerTimeout(() => {
                if (currentCycle !== animationCycle) return;
                linksData.forEach((link, index) => {
                    const el = document.getElementById(link.id);
                    registerTimeout(() => {
                        if (currentCycle !== animationCycle) return;
                        typeWriterIn(el, link.text, 60, currentCycle);
                    }, index * 250); 
                });
                registerTimeout(() => {
                    if (currentCycle !== animationCycle) return;
                    typeWriterLangIn(currentCycle);
                }, 4 * 250);
            }, 800); 

            registerTimeout(() => {
                if (currentCycle !== animationCycle) return;

                vidReveil.style.display = 'block';
                registerTimeout(() => {
                    if (currentCycle !== animationCycle) return;
                    vidReveil.style.opacity = '1'; 
                }, 10);

                let playPromise = vidReveil.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {});
                }

                registerTimeout(() => {
                    if (currentCycle !== animationCycle) return;
                    document.getElementById('head-idle').style.display = 'block';
                    
                    registerTimeout(() => {
                        vidReveil.style.display = 'none';
                    }, 50);
                    
                    typeWriterIn(titleEl, 'eliott atom\ncroubalian', 70, currentCycle);

                    document.querySelectorAll('.corner-link').forEach(link => {
                        link.style.pointerEvents = 'auto';
                    });

                    if (langWrap) langWrap.style.pointerEvents = 'auto';

                }, 3500);

            }, 2000);
        }

        // AFFICHAGE DIRECT SANS ANIMATIONS (RETOUR SUR LA PAGE)
        function skipIntroSequence() {
            clearAllTimeouts();
            animationCycle++;

            try {
                sessionStorage.setItem('introPlayed', 'true');
            } catch (e) {}

            isTransitioning = false;
            document.body.style.pointerEvents = 'auto';

            // 1. Overlay noir masqué
            const overlay = document.getElementById('black-overlay');
            overlay.style.transition = 'none';
            overlay.classList.remove('show');
            overlay.style.opacity = '0';
            void overlay.offsetWidth;
            overlay.style.transition = '';

            // 2. Conteneur principal en thème blanc immédiat
            const contentLayer = document.getElementById('content-layer');
            contentLayer.style.transition = 'none';
            contentLayer.classList.remove('theme-inverted');
            contentLayer.classList.add('theme-white');
            void contentLayer.offsetWidth;
            contentLayer.style.transition = '';

            // 3. Masque et stoppe toutes les vidéos
            document.querySelectorAll('.interactive-video').forEach(vid => {
                vid.pause();
                vid.currentTime = 0;
                vid.style.display = 'none';
            });

            const vidReveil = document.getElementById('vid-reveil');
            vidReveil.pause();
            vidReveil.currentTime = 0;
            vidReveil.style.opacity = '0';
            vidReveil.style.display = 'none';

            // 4. Affiche directement la tête idle
            document.getElementById('head-idle').style.display = 'block';

            // 5. Réinitialise la bulle
            const bubble = document.getElementById('speech-bubble');
            bubble.classList.remove('show');
            bubble.innerHTML = '';
            bubble.style.display = '';

            // 6. Titre centré directement
            const titleEl = document.getElementById('main-title');
            titleEl.style.transition = 'none';
            titleEl.classList.remove('move-to-header');
            titleEl.innerHTML = 'eliott atom\ncroubalian';
            void titleEl.offsetWidth;
            titleEl.style.transition = '';

            // 7. Boutons de coin avec texte complet et cliquables
            linksData.forEach(link => {
                const el = document.getElementById(link.id);
                if (el) {
                    el.classList.remove('is-active');
                    el.innerHTML = link.text;
                    el.style.pointerEvents = 'auto';
                }
            });

            const langWrap = document.getElementById('lang-switch');
            if (langWrap) {
                langWrap.innerHTML = renderLangSwitchHtml(5);
                langWrap.classList.add('is-visible');
                langWrap.style.pointerEvents = 'auto';
                requestAnimationFrame(() => {
                    const active = document.getElementById('lang-item-en');
                    if (active) positionLangUnderline(active, true);
                });
            }
        }

        function shouldSkipIntro() {
            // 1. Si le paramètre ?return=true est présent dans l'URL (clic sur un bouton "retour")
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('return') === 'true' || window.location.hash === '#return') {
                try {
                    window.history.replaceState({}, '', window.location.pathname);
                } catch (e) {}
                return true;
            }

            // 2. Retour arrière navigateur (historique back / forward)
            const navEntries = performance.getEntriesByType && performance.getEntriesByType('navigation');
            const navType = (navEntries && navEntries.length > 0) ? navEntries[0].type : '';
            if (navType === 'back_forward') {
                return true;
            }

            // 3. Si l'utilisateur revient depuis une sous-page du portfolio (referrer)
            if (document.referrer) {
                try {
                    const refUrl = new URL(document.referrer);
                    const cleanRef = refUrl.pathname.replace(/\/$/, '').replace(/\.html$/, '');
                    if (cleanRef.endsWith('cv') || 
                        cleanRef.endsWith('contact') || 
                        cleanRef.endsWith('portfolio') || 
                        cleanRef.endsWith('content') || 
                        cleanRef.endsWith('info')) {
                        return true;
                    }
                } catch (e) {
                    if (document.referrer.includes('cv') || 
                        document.referrer.includes('contact') || 
                        document.referrer.includes('portfolio') || 
                        document.referrer.includes('content') || 
                        document.referrer.includes('info')) {
                        return true;
                    }
                }
            }

            // Pour tout nouvel onglet, lien envoyé à quelqu'un, rechargement, etc. :
            // Toujours jouer l'animation de réveil !
            return false;
        }

        // CHARGEMENT INITIAL OU RETOUR
        if (shouldSkipIntro()) {
            skipIntroSequence();
        } else {
            startIntroSequence();
        }

        // GESTION DU RETOUR ARRIÈRE MOBILE ET DESKTOP (SAFARI / CHROME BFCACHE)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted || isTransitioning || shouldSkipIntro()) {
                skipIntroSequence();
            }
        });

        // SORTIES DE PAGE VERS LES AUTRES SECTIONS
        const interactions = [
            { btnId: 'btn-index', vidId: 'vid-top-left' },
            { btnId: 'btn-info', vidId: 'vid-top-right' },
            { btnId: 'btn-cv', vidId: 'vid-bottom-left' },
            { btnId: 'btn-contact', vidId: 'vid-bottom-right' }
        ];

        interactions.forEach(item => {
            const btn = document.getElementById(item.btnId);
            const video = document.getElementById(item.vidId);

            if (btn && video) {
                btn.addEventListener('click', function(e) {
                    if (isTransitioning) return;
                    
                    isTransitioning = true;
                    clearAllTimeouts();
                    e.preventDefault(); 
                    
                    document.body.style.pointerEvents = 'none';
                    let targetUrl = this.getAttribute('href');
                    const isHtmlEnv = window.location.pathname.endsWith('.html') || window.location.protocol === 'file:';
                    if (isHtmlEnv && !targetUrl.endsWith('.html')) {
                        targetUrl += '.html';
                    }

                    const langWrap = document.getElementById('lang-switch');
                    if (langWrap) langWrap.style.pointerEvents = 'none';

                    this.classList.add('is-active');
                    const speechBubble = document.getElementById('speech-bubble');
                    if (speechBubble) speechBubble.style.display = 'none';
                    const vidReveil = document.getElementById('vid-reveil');
                    if (vidReveil) vidReveil.style.display = 'none';
                    
                    const headIdle = document.getElementById('head-idle');

                    video.currentTime = 0;
                    video.style.display = 'block';

                    let playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {});
                    }

                    // Masquer l'image fixe uniquement quand la vidéo affiche réellement sa première frame
                    let headHidden = false;
                    const hideIdleHead = () => {
                        if (!headHidden) {
                            headHidden = true;
                            if (headIdle) headIdle.style.display = 'none';
                        }
                    };

                    if ('requestVideoFrameCallback' in video) {
                        video.requestVideoFrameCallback(hideIdleHead);
                    } else {
                        video.addEventListener('playing', hideIdleHead, { once: true });
                    }
                    registerTimeout(hideIdleHead, 120);

                    registerTimeout(() => {
                        video.pause();
                        document.getElementById('content-layer').classList.add('theme-inverted');

                        registerTimeout(() => {
                            if (item.btnId === 'btn-index') {
                                const titleEl = document.getElementById('main-title');
                                titleEl.innerHTML = 'eliott atom\ncroubalian'; 
                                titleEl.classList.add('move-to-header');
                            } else {
                                typeWriterOut(document.getElementById('main-title'), 50);
                            }
                            
                            typeWriterOut(document.getElementById(item.btnId), 25); 
                            typeWriterLangOut(25);

                            registerTimeout(() => {
                                const overlay = document.getElementById('black-overlay');
                                overlay.style.opacity = '1';
                                overlay.classList.add('show');
                                
                                registerTimeout(() => {
                                    window.location.href = targetUrl;
                                }, 300);

                            }, 1200); 

                        }, 800); 

                    }, 3000); 
                });
            }
        });

        // EASTER EGG BULLE DE DIALOGUE
        const phrases = [
            "stop poking my face.",
            "i'm trying to look professional.",
            "the links are in the corners.",
            "ouch.",
            "do i know you?",
            "yes, i actually look like this.",
            "are we playing a game?",
            "stop poking my face.",
    "concussion incoming.",
    "you're ruining my hair.",
    "please respect the personal bubble.",
    "error 404: reaction not found.",
    "made of 100% recycled concrete.",
    "smells like foam board and cyanoacrylate.",
    "don't ask about the render times.",
    "built entirely out of cardboard and coffee.",
    "take 43... action.",
    "i studied for this.",
    "fix my face in post.",
    "it burns!          just kidding",
    "the lighting was actually great that day.",
    "prize winner (allegedly).",
    "harder!",
    "now with 20% more magenta.",
    "contains small parts. choking hazard.",
    "recidive",
    "beep boop. wait, i'm a human.",
    "why are you still here?",
    "you found the secret dialogue! (there is no prize).",
    "do not feed after midnight"
        ];

        document.getElementById('head-idle').addEventListener('click', function() {
            if (isTransitioning) return;
            
            const bubble = document.getElementById('speech-bubble');
            clearTimeout(bubbleTypeTimeout);
            
            bubble.classList.remove('show');
            bubble.innerHTML = ''; 
            
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * phrases.length);
            } while (newIndex === lastPhraseIndex);
            lastPhraseIndex = newIndex;
            
            const selectedText = phrases[newIndex];
            void bubble.offsetWidth; 
            bubble.classList.add('show');
            
            let i = 0;
            function typeBubble() {
                let visiblePart = selectedText.substring(0, i);
                let hiddenPart = selectedText.substring(i);
                bubble.innerHTML = visiblePart + '<span style="visibility: hidden;">' + hiddenPart + '</span>';
                
                if (i < selectedText.length) {
                    i++;
                    bubbleTypeTimeout = setTimeout(typeBubble, 25);
                }
            }
            typeBubble();
        });

        // ==========================================
        // SÉLECTEUR DE LANGUE (EN -> FR)
        // ==========================================
        function positionLangUnderline(targetEl, immediate) {
            const underline = document.getElementById('lang-underline');
            if (!underline || !targetEl) return;
            const left = targetEl.offsetLeft;
            const width = targetEl.offsetWidth;
            if (width === 0) return;

            if (immediate) {
                underline.style.transition = 'none';
                underline.style.transform = `translateX(${left}px)`;
                underline.style.width = `${width}px`;
                underline.style.opacity = '1';
                void underline.offsetWidth;
                underline.style.transition = '';
            } else {
                underline.style.transition = 'transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), width 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease';
                underline.style.transform = `translateX(${left}px)`;
                underline.style.width = `${width}px`;
                underline.style.opacity = '1';
            }
        }

        (function() {
            const langSwitch = document.getElementById('lang-switch');
            if (!langSwitch) return;

            const initUnderline = () => {
                const active = langSwitch.querySelector('.lang-item.is-active') || document.getElementById('lang-item-en');
                if (active) positionLangUnderline(active, true);
            };
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                initUnderline();
            } else {
                window.addEventListener('DOMContentLoaded', initUnderline);
            }
            window.addEventListener('load', initUnderline);
            if (document.fonts) document.fonts.ready.then(initUnderline);
            window.addEventListener('resize', initUnderline, { passive: true });

            langSwitch.addEventListener('click', function(e) {
                const targetLink = e.target.closest('a#lang-link-fr');
                if (!targetLink) return;
                if (isTransitioning) return;

                isTransitioning = true;
                e.preventDefault();
                document.body.style.pointerEvents = 'none';

                const enItem = document.getElementById('lang-item-en');
                const frLink = targetLink;

                // 1. Basculer l'état visuel actif
                if (enItem) {
                    enItem.classList.remove('is-active');
                    enItem.style.fontWeight = '500';
                }
                frLink.classList.add('is-active');
                frLink.style.fontWeight = '900';
                frLink.style.color = '#000000';

                // 2. Glissement fluide du soulignement vers fr
                positionLangUnderline(frLink, false);

                const isHtmlEnv = window.location.pathname.endsWith('.html') || window.location.protocol === 'file:';
                const targetUrl = isHtmlEnv ? 'index_fr.html?return=true' : 'index_fr?return=true';

                // 3. Navigation une fois l'animation terminée
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 300);
            });
        })();
    </script>
