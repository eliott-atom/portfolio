<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>contact</title>
    <link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script>
        if (window.location.pathname.endsWith('.html')) {
            let clean = window.location.pathname.replace(/\/index\.html$/, '/').replace(/\.html$/, '');
            if (!clean) clean = '/';
            window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
        }
    </script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background-color: #f2f2f2;
            color: #111111;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 6vh 6vw;
            user-select: none;
            -webkit-user-select: none;
        }

        /* TRANSITION FONDU AU NOIR */
        .black-fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            pointer-events: none;
            animation: fadeOutBlack 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes fadeOutBlack {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* BOUTON RETOUR */
        .back-btn {
            position: absolute;
            top: 40px;
            right: 40px;
            -webkit-appearance: none;
            appearance: none;
            border: none;
            display: inline-block;
            background-color: #111111;
            color: #ffffff;
            font-family: "Libre Franklin", sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: lowercase;
            text-decoration: none;
            letter-spacing: 0.5px;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .back-btn:hover {
            background-color: #ff00ff;
            transform: scale(1.05);
        }

        .back-btn:active {
            transform: scale(0.97);
        }

        /* INDEX DES CONTACTS */
        .contact-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
        }

        .contact-item {
            position: relative;
            display: flex;
            align-items: flex-start;
        }

        .contact-index {
            font-family: "Libre Franklin", sans-serif;
            font-weight: 700;
            font-size: 12px;
            color: #111111;
            margin-top: 1vw;
            margin-right: 2vw;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .contact-link {
            font-family: "Libre Franklin", sans-serif;
            font-weight: 900;
            font-size: clamp(3rem, 9vw, 9rem); 
            line-height: 0.85;
            letter-spacing: -0.04em;
            color: #111111;
            text-decoration: none;
            text-transform: lowercase;
            transition: color 0.2s ease, transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            transform-origin: left center;
        }

        .contact-item:hover .contact-link {
            color: #ff00ff;
            transform: translateX(1.5vw);
        }

        .contact-item:hover .contact-index {
            color: #ff00ff;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .back-btn {
                top: 20px;
                right: 20px;
            }
            
            .contact-container {
                margin-top: 80px;
            }
            
            .contact-list {
                gap: 3vh;
            }
            
            .contact-index {
                margin-top: 2vw;
                margin-right: 4vw;
            }
        }
    </style>
</head>
<body>

    <div class="black-fade-overlay"></div>

    <a href="index_fr.html?return=true" class="back-btn">retour</a>

    <div class="contact-container">
        <ul class="contact-list">
            
            <li class="contact-item">
                <span class="contact-index">01</span>
                <a href="mailto:contact@eliott-atom.ch" class="contact-link">mail</a>
            </li>

            <li class="contact-item">
                <span class="contact-index">02</span>
                <a href="https://www.linkedin.com/in/eliott-croubalian/" target="_blank" class="contact-link">linkedin</a>
            </li>

            <li class="contact-item">
                <span class="contact-index">03</span>
                <a href="https://www.youtube.com/@eliottcroubalian2495" target="_blank" class="contact-link">youtube</a>
            </li>

        </ul>
    </div>

</body>
</html>
