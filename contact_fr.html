<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>contact</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-light.png?v=3">
    <link rel="shortcut icon" href="favicon.ico?v=3">
    <link rel="apple-touch-icon" href="favicon-light.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script>
        try {
            if (window.location.protocol.startsWith('http') && window.location.pathname.endsWith('.html')) {
                let clean = window.location.pathname.replace(/\/index\.html$/, '/').replace(/\.html$/, '');
                if (!clean) clean = '/';
                window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
            }
        } catch (e) {}
    </script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background-color: #f2f2f2;
            color: #111111;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 6vh 6vw;
            user-select: none;
            -webkit-user-select: none;
        }

        /* TRANSITION FONDU AU NOIR */
        .black-fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            pointer-events: none;
            animation: fadeOutBlack 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes fadeOutBlack {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* TOP NAV (RETOUR + LANG SWITCH) */
        .top-nav-group {
            position: absolute;
            top: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 100;
        }

        /* BOUTON RETOUR */
        .back-btn {
            -webkit-appearance: none;
            appearance: none;
            border: none;
            display: inline-block;
            background-color: #111111;
            color: #ffffff;
            font-family: "Libre Franklin", sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: lowercase;
            text-decoration: none;
            letter-spacing: 0.5px;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .back-btn:hover {
            background-color: #ff00ff;
            transform: scale(1.05);
        }

        .back-btn:active {
            transform: scale(0.97);
        }

        .lang-switch {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: 500;
            text-transform: lowercase;
            color: #111111;
            display: flex;
            align-items: baseline;
            user-select: none;
            -webkit-user-select: none;
        }

        .lang-switch a,
        .lang-switch span {
            color: #111111;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .lang-switch a {
            cursor: pointer;
        }

        .lang-switch .is-active {
            font-weight: 900;
            cursor: default;
            pointer-events: none;
        }

        .lang-switch a:hover {
            color: #ff00ff;
            font-weight: 900;
        }

        .lang-switch .lang-sep {
            color: #111111;
            font-weight: 500;
            cursor: default;
            pointer-events: none;
        }

        /* INDEX DES CONTACTS */
        .contact-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
        }

        .contact-item {
            display: flex;
            align-items: baseline;
            width: 100%;
        }

        .contact-index {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 2vw;
            font-weight: 300;
            color: #000000;
            opacity: 0.25;
            margin-right: 3vw;
            width: 50px;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .contact-link {
            font-family: "Libre Franklin", sans-serif;
            font-weight: 900;
            font-size: 8vw;
            line-height: 0.95;
            color: #111111;
            text-decoration: none;
            text-transform: lowercase;
            transition: color 0.2s ease, transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            transform-origin: left center;
        }

        .contact-item:hover .contact-link {
            color: #ff00ff;
            transform: translateX(1.5vw);
        }

        .contact-item:hover .contact-index {
            color: #ff00ff;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .top-nav-group {
                top: 20px;
                right: 20px;
            }
            
            .contact-container {
                margin-top: 80px;
            }
            
            .contact-list {
                gap: 3vh;
            }
            
            .contact-index {
                margin-top: 2vw;
                margin-right: 4vw;
            }
        }
    </style>
</head>
<body>

    <div class="black-fade-overlay"></div>

    <!-- Navigation haut-droite : retour + switch langue -->
    <div class="top-nav-group">
        <a href="index_fr.html?return=true" class="back-btn">retour</a>
        <nav class="lang-switch" aria-label="Choix de la langue">
            <a href="contact.html">en</a><span class="lang-sep">/</span><span class="is-active" aria-current="page">fr</span>
        </nav>
    </div>

    <div class="contact-container">
        <ul class="contact-list">
            
            <li class="contact-item">
                <span class="contact-index">01</span>
                <a href="mailto:contact@eliott-atom.ch" class="contact-link">mail</a>
            </li>

            <li class="contact-item">
                <span class="contact-index">02</span>
                <a href="https://www.linkedin.com/in/eliott-croubalian/" target="_blank" rel="noopener noreferrer" class="contact-link">linkedin</a>
            </li>

            <li class="contact-item">
                <span class="contact-index">03</span>
                <a href="https://www.youtube.com/@eliottcroubalian2495" target="_blank" rel="noopener noreferrer" class="contact-link">youtube</a>
            </li>

        </ul>
    </div>

</body>
</html>
