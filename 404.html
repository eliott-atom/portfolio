<!DOCTYPE html>
<html>
<head>
  <script>
    // If the broken URL is inside /movie/, bounce to movie/index.html and remember the path
    if (window.location.pathname.includes('/movie')) {
      sessionStorage.setItem('redirect_path', window.location.pathname);
      window.location.replace('/movie/');
    } else {
      document.write('<h1>404 - Page Not Found</h1>');
    }
  </script>
</head>
<body></body>
</html>
