<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const currentPath = window.location.pathname;

    // Check if the 404 occurred inside the movie project
    if (currentPath.includes('/movie')) {
      // 1. Save the full intended URL (e.g. /your-repo/movie/love-is-love)
      sessionStorage.setItem('redirect_path', currentPath);

      // 2. Extract everything up to and including "/movie/" so we keep the repo name
      const movieIdx = currentPath.indexOf('/movie');
      const targetBase = currentPath.substring(0, movieIdx + '/movie/'.length);

      // 3. Bounce cleanly to movie/index.html
      window.location.replace(targetBase);
    } else {
      document.write('<h1 style="font-family:sans-serif;padding:40px;">404 - Not Found</h1>');
    }
  </script>
</head>
<body></body>
</html>
