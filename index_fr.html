<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bienvenue</title>
    <link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;900&display=swap" rel="stylesheet">
    <script>
        if (window.location.pathname.endsWith('.html')) {
            let clean = window.location.pathname.replace(/\/index\.html$/, '/').replace(/\.html$/, '');
            if (!clean) clean = '/';
            window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden; 
        }

        body {
            background-color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 500;
            font-size: 20px;
        }

        #content-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #000000;
            z-index: 1;
            transition: background-color 0.8s ease, filter 0.8s linear; 
        }

        #content-layer.theme-white {
            background-color: #ffffff;
        }

        #content-layer.theme-inverted {
            filter: invert(1);
        }

        .corner-link {
            position: fixed;
            z-index: 10; 
            padding: 4vw; 
            text-decoration: none;
            text-transform: lowercase;
            color: #000000; 
            transition: color 0.15s ease;
            pointer-events: none; 
        }

        .corner-link:hover,
        .corner-link.is-active {
            font-weight: 900;
            color: #ff00ff; 
        }

        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; text-align: right; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; text-align: right; }

        div.grid-wrapper {
            display: grid;
            width: 100%;
            height: 100%;
            height: 100dvh;
            place-items: center; 
            position: relative; 
        }

        img, video {
            width: 75%;
            max-width: 500px;
            max-width: min(500px, 75dvh);
            display: block;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            object-position: center;
            grid-area: 1 / 1;
        }

        #head-idle {
            cursor: pointer;
            z-index: 2;
        }

        .interactive-video {
            z-index: 3;
        }

        #head-idle, #vid-reveil, .interactive-video {
            display: none;
        }
        #vid-reveil {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #speech-bubble {
            position: absolute;
            top: 25%;
            left: 55%;
            max-width: 250px;
            background-color: #ff00ff;
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 30px 30px 30px 5px;
            font-family: "Libre Franklin", sans-serif;
            font-weight: 900;
            font-size: 16px;
            line-height: 1.2;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transform: scale(0);
            transform-origin: bottom left; 
            transition: opacity 0.2s ease, transform 0s ease;
        }

        #speech-bubble.show {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.2s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #main-title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 900;
            font-size: 6vw; 
            line-height: 1; 
            text-align: center; 
            text-transform: lowercase;
            color: #ffffff;
            mix-blend-mode: difference; 
            pointer-events: none; 
            z-index: 10000;
            white-space: pre; 
            transition: top 1.2s ease-in-out, left 1.2s ease-in-out, transform 1.2s ease-in-out, font-size 1.2s ease-in-out;
        }
        #main-title.move-to-header {
            top: 2vw;
            left: 4vw;
            transform: translate(0, 0); 
            font-size: 26px; 
            text-align: left;
        }

        #black-overlay {
            position: fixed;
            inset: 0;
            background-color: #000000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease; 
        }
        #black-overlay.show {
            opacity: 1;
        }

        @media (max-aspect-ratio: 4/5) {
            #main-title {
                font-size: 12vw;
            }
            
            #main-title.move-to-header {
                top: 2vw;
                left: 4vw;
                font-size: 15.6px;
            }
        }

        /* TOGGLE SWITCH EN / FR (Bottom Center) */
        .lang-toggle-wrap {
            position: fixed;
            bottom: max(18px, 3.2vw);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .lang-toggle-wrap.is-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .lang-switch {
            position: relative;
            width: 51px;
            height: 31px;
            border-radius: 31px;
            background-color: #e9e9ea;
            box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.12);
            cursor: pointer;
            touch-action: none;
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
            outline: none;
        }

        .lang-switch:focus-visible {
            box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.25), 0 0 0 3px rgba(255, 0, 255, 0.35);
        }

        .lang-switch.is-on {
            background-color: #ff00ff;
            box-shadow: inset 0 0 0 1.5px #ff00ff;
        }

        .lang-switch-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18), 0 1px 2px rgba(0, 0, 0, 0.1);
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), color 0.25s ease;
            pointer-events: none;
            will-change: transform;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Libre Franklin", sans-serif;
            font-weight: 900;
            font-size: 11px;
            line-height: 1;
            letter-spacing: -0.2px;
            text-transform: lowercase;
            color: #111111;
        }

        .lang-switch.is-on .lang-switch-knob {
            transform: translateX(20px);
            color: #ff00ff;
        }

        .lang-switch.is-dragging .lang-switch-knob {
            transition: none;
        }
    </style>
</head>
<body>

    <div id="black-overlay"></div>

    <!-- BOUTONS -->
    <a href="portfolio_fr" class="corner-link top-left" id="btn-index"></a>
    <a href="info_fr" class="corner-link top-right" id="btn-info"></a>
    <a href="cv_fr" class="corner-link bottom-left" id="btn-cv"></a>
    <a href="contact_fr" class="corner-link bottom-right" id="btn-contact"></a>

    <!-- TOGGLE SWITCH LANGUE (FR / EN) -->
    <div id="lang-toggle-wrap" class="lang-toggle-wrap" title="English version">
        <div id="lang-switch" class="lang-switch is-on" role="switch" aria-checked="true" tabindex="0" aria-label="Passer en version anglaise">
            <div class="lang-switch-knob" id="lang-switch-knob">fr</div>
        </div>
    </div>

    <div id="content-layer">
        <div class="grid-wrapper">
            
            <video id="vid-reveil" preload="auto" muted playsinline>
                <source src="reveil.mp4" type="video/mp4">
            </video>

            <img id="head-idle" src="tete-centre.webp" alt="Animation d'introduction">
            
            <div id="speech-bubble"></div>
            
            <video id="vid-top-left" class="interactive-video" poster="tete-centre.webp" preload="auto" muted playsinline>
                <source src="regarde-haut-gauche.mp4" type="video/mp4">
            </video>
            <video id="vid-top-right" class="interactive-video" poster="tete-centre.webp" preload="auto" muted playsinline>
                <source src="regarde-haut-droite.mp4" type="video/mp4">
            </video>
            <video id="vid-bottom-left" class="interactive-video" poster="tete-centre.webp" preload="auto" muted playsinline>
                <source src="regarde-bas-gauche.mp4" type="video/mp4">
            </video>
            <video id="vid-bottom-right" class="interactive-video" poster="tete-centre.webp" preload="auto" muted playsinline>
                <source src="regarde-bas-droite.mp4" type="video/mp4">
            </video>

        </div>
    </div> 

    <div id="main-title"></div>

    <script>
        let isTransitioning = false;
        let animationCycle = 0;
        let activeTimeouts = [];
        let bubbleTypeTimeout;
        let lastPhraseIndex = -1;

        const linksData = [
            { id: 'btn-index', text: 'portfolio' },
            { id: 'btn-info', text: 'love is love is love' },
            { id: 'btn-cv', text: 'cv' },
            { id: 'btn-contact', text: 'contact' }
        ];

        function registerTimeout(fn, delay) {
            const id = setTimeout(fn, delay);
            activeTimeouts.push(id);
            return id;
        }

        function clearAllTimeouts() {
            activeTimeouts.forEach(t => clearTimeout(t));
            activeTimeouts = [];
            clearTimeout(bubbleTypeTimeout);
        }

        function typeWriterIn(element, text, speed, cycle, callback) {
            let i = 0;
            function type() {
                if (cycle !== animationCycle) return;
                let visiblePart = text.substring(0, i);
                let hiddenPart = text.substring(i);
                
                element.innerHTML = visiblePart + '<span style="visibility: hidden;">' + hiddenPart + '</span>';
                
                if (i < text.length) {
                    i++;
                    registerTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        function typeWriterOut(element, speed, callback) {
            let text = (element.id === 'main-title') 
                ? 'eliott atom\ncroubalian' 
                : (element.textContent || element.innerText); 
            let i = text.length;

            function untype() {
                let visiblePart = text.substring(0, i);
                let hiddenPart = text.substring(i);

                element.innerHTML = visiblePart + '<span style="visibility: hidden;">' + hiddenPart + '</span>';

                if (i > 0) {
                    i--;
                    registerTimeout(untype, speed);
                } else if (callback) {
                    element.innerHTML = ''; 
                    callback();
                }
            }
            untype();
        }

        function startIntroSequence() {
            clearAllTimeouts();
            animationCycle++;
            const currentCycle = animationCycle;

            try {
                sessionStorage.setItem('introPlayed', 'true');
            } catch (e) {}

            isTransitioning = false;
            document.body.style.pointerEvents = 'auto';

            const overlay = document.getElementById('black-overlay');
            overlay.style.transition = 'none';
            overlay.classList.remove('show');
            overlay.style.opacity = '0';
            void overlay.offsetWidth;
            overlay.style.transition = '';

            const contentLayer = document.getElementById('content-layer');
            contentLayer.style.transition = 'none';
            contentLayer.classList.remove('theme-white', 'theme-inverted');
            void contentLayer.offsetWidth;
            contentLayer.style.transition = '';

            document.querySelectorAll('.interactive-video').forEach(vid => {
                vid.pause();
                vid.currentTime = 0;
                vid.style.display = 'none';
            });

            const vidReveil = document.getElementById('vid-reveil');
            vidReveil.pause();
            vidReveil.currentTime = 0;
            vidReveil.style.opacity = '0';
            vidReveil.style.display = 'none';

            document.getElementById('head-idle').style.display = 'none';
            const bubble = document.getElementById('speech-bubble');
            bubble.classList.remove('show');
            bubble.innerHTML = '';
            bubble.style.display = '';

            const langWrap = document.getElementById('lang-toggle-wrap');
            if (langWrap) langWrap.classList.remove('is-visible');

            const titleEl = document.getElementById('main-title');
            titleEl.style.transition = 'none';
            titleEl.classList.remove('move-to-header');
            titleEl.innerHTML = '';
            void titleEl.offsetWidth;
            titleEl.style.transition = '';

            linksData.forEach(link => {
                const el = document.getElementById(link.id);
                if (el) {
                    el.classList.remove('is-active');
                    el.innerHTML = '';
                    el.style.pointerEvents = 'none';
                }
            });

            registerTimeout(() => {
                if (currentCycle !== animationCycle) return;
                contentLayer.classList.add('theme-white');
            }, 200);

            registerTimeout(() => {
                if (currentCycle !== animationCycle) return;
                linksData.forEach((link, index) => {
                    const el = document.getElementById(link.id);
                    registerTimeout(() => {
                        if (currentCycle !== animationCycle) return;
                        typeWriterIn(el, link.text, 60, currentCycle);
                    }, index * 250); 
                });
            }, 800); 

            registerTimeout(() => {
                if (currentCycle !== animationCycle) return;

                vidReveil.style.display = 'block';
                registerTimeout(() => {
                    if (currentCycle !== animationCycle) return;
                    vidReveil.style.opacity = '1'; 
                }, 10);

                let playPromise = vidReveil.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {});
                }

                registerTimeout(() => {
                    if (currentCycle !== animationCycle) return;
                    document.getElementById('head-idle').style.display = 'block';
                    
                    registerTimeout(() => {
                        vidReveil.style.display = 'none';
                    }, 50);
                    
                    typeWriterIn(titleEl, 'eliott atom\ncroubalian', 70, currentCycle);

                    document.querySelectorAll('.corner-link').forEach(link => {
                        link.style.pointerEvents = 'auto';
                    });

                    if (langWrap) langWrap.classList.add('is-visible');

                }, 3500);

            }, 2000);
        }

        function skipIntroSequence() {
            clearAllTimeouts();
            animationCycle++;

            try {
                sessionStorage.setItem('introPlayed', 'true');
            } catch (e) {}

            isTransitioning = false;
            document.body.style.pointerEvents = 'auto';

            const overlay = document.getElementById('black-overlay');
            overlay.style.transition = 'none';
            overlay.classList.remove('show');
            overlay.style.opacity = '0';
            void overlay.offsetWidth;
            overlay.style.transition = '';

            const contentLayer = document.getElementById('content-layer');
            contentLayer.style.transition = 'none';
            contentLayer.classList.remove('theme-inverted');
            contentLayer.classList.add('theme-white');
            void contentLayer.offsetWidth;
            contentLayer.style.transition = '';

            document.querySelectorAll('.interactive-video').forEach(vid => {
                vid.pause();
                vid.currentTime = 0;
                vid.style.display = 'none';
            });

            const vidReveil = document.getElementById('vid-reveil');
            vidReveil.pause();
            vidReveil.currentTime = 0;
            vidReveil.style.opacity = '0';
            vidReveil.style.display = 'none';

            document.getElementById('head-idle').style.display = 'block';

            const bubble = document.getElementById('speech-bubble');
            bubble.classList.remove('show');
            bubble.innerHTML = '';
            bubble.style.display = '';

            const titleEl = document.getElementById('main-title');
            titleEl.style.transition = 'none';
            titleEl.classList.remove('move-to-header');
            titleEl.innerHTML = 'eliott atom\ncroubalian';
            void titleEl.offsetWidth;
            titleEl.style.transition = '';

            linksData.forEach(link => {
                const el = document.getElementById(link.id);
                if (el) {
                    el.classList.remove('is-active');
                    el.innerHTML = link.text;
                    el.style.pointerEvents = 'auto';
                }
            });

            const langWrap = document.getElementById('lang-toggle-wrap');
            if (langWrap) langWrap.classList.add('is-visible');
        }

        function shouldSkipIntro() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('return') === 'true' || window.location.hash === '#return') {
                try {
                    window.history.replaceState({}, '', window.location.pathname);
                } catch (e) {}
                return true;
            }

            const navEntries = performance.getEntriesByType && performance.getEntriesByType('navigation');
            const navType = (navEntries && navEntries.length > 0) ? navEntries[0].type : '';
            if (navType === 'back_forward') {
                return true;
            }

            if (document.referrer) {
                try {
                    const refUrl = new URL(document.referrer);
                    const cleanRef = refUrl.pathname.replace(/\/$/, '').replace(/\.html$/, '');
                    if (cleanRef.endsWith('cv') || 
                        cleanRef.endsWith('cv_fr') || 
                        cleanRef.endsWith('contact') || 
                        cleanRef.endsWith('contact_fr') || 
                        cleanRef.endsWith('portfolio') || 
                        cleanRef.endsWith('portfolio_fr') || 
                        cleanRef.endsWith('content') || 
                        cleanRef.endsWith('content_fr') || 
                        cleanRef.endsWith('info') ||
                        cleanRef.endsWith('info_fr')) {
                        return true;
                    }
                } catch (e) {
                    if (document.referrer.includes('cv') || 
                        document.referrer.includes('contact') || 
                        document.referrer.includes('portfolio') || 
                        document.referrer.includes('content') || 
                        document.referrer.includes('info')) {
                        return true;
                    }
                }
            }

            return false;
        }

        if (shouldSkipIntro()) {
            skipIntroSequence();
        } else {
            startIntroSequence();
        }

        window.addEventListener('pageshow', (event) => {
            if (event.persisted || isTransitioning || shouldSkipIntro()) {
                skipIntroSequence();
            }
        });

        const interactions = [
            { btnId: 'btn-index', vidId: 'vid-top-left' },
            { btnId: 'btn-info', vidId: 'vid-top-right' },
            { btnId: 'btn-cv', vidId: 'vid-bottom-left' },
            { btnId: 'btn-contact', vidId: 'vid-bottom-right' }
        ];

        interactions.forEach(item => {
            const btn = document.getElementById(item.btnId);
            const video = document.getElementById(item.vidId);

            if (btn && video) {
                btn.addEventListener('click', function(e) {
                    if (isTransitioning) return;
                    
                    isTransitioning = true;
                    clearAllTimeouts();
                    e.preventDefault(); 
                    
                    document.body.style.pointerEvents = 'none';
                    let targetUrl = this.getAttribute('href');
                    const isHtmlEnv = window.location.pathname.endsWith('.html') || window.location.protocol === 'file:';
                    if (isHtmlEnv && !targetUrl.endsWith('.html')) {
                        targetUrl += '.html';
                    }

                    const langWrap = document.getElementById('lang-toggle-wrap');
                    if (langWrap) langWrap.classList.remove('is-visible');

                    this.classList.add('is-active');
                    const speechBubble = document.getElementById('speech-bubble');
                    if (speechBubble) speechBubble.style.display = 'none';
                    const vidReveil = document.getElementById('vid-reveil');
                    if (vidReveil) vidReveil.style.display = 'none';
                    
                    const headIdle = document.getElementById('head-idle');

                    video.currentTime = 0;
                    video.style.display = 'block';

                    let playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {});
                    }

                    let headHidden = false;
                    const hideIdleHead = () => {
                        if (!headHidden) {
                            headHidden = true;
                            if (headIdle) headIdle.style.display = 'none';
                        }
                    };

                    if ('requestVideoFrameCallback' in video) {
                        video.requestVideoFrameCallback(hideIdleHead);
                    } else {
                        video.addEventListener('playing', hideIdleHead, { once: true });
                    }
                    registerTimeout(hideIdleHead, 120);

                    registerTimeout(() => {
                        video.pause();
                        document.getElementById('content-layer').classList.add('theme-inverted');

                        registerTimeout(() => {
                            if (item.btnId === 'btn-index') {
                                const titleEl = document.getElementById('main-title');
                                titleEl.innerHTML = 'eliott atom\ncroubalian'; 
                                titleEl.classList.add('move-to-header');
                            } else {
                                typeWriterOut(document.getElementById('main-title'), 50);
                            }
                            
                            typeWriterOut(document.getElementById(item.btnId), 25); 

                            registerTimeout(() => {
                                const overlay = document.getElementById('black-overlay');
                                overlay.style.opacity = '1';
                                overlay.classList.add('show');
                                
                                registerTimeout(() => {
                                    window.location.href = targetUrl;
                                }, 300);

                            }, 1200); 

                        }, 800); 

                    }, 3000); 
                });
            }
        });

        const phrases = [
            "arrête de me tripoter le visage.",
            "j'essaie d'avoir l'air professionnel.",
            "les liens sont dans les coins.",
            "aïe.",
            "on se connaît ?",
            "oui, je ressemble vraiment à ça.",
            "on joue à un jeu ?",
            "commotion cérébrale imminente.",
            "tu ruines mes cheveux.",
            "merci de respecter ma bulle personnelle.",
            "erreur 404 : réaction introuvable.",
            "100% béton recyclé.",
            "odeur de carton plume et de cyanoacrylate.",
            "ne me parle pas des temps de rendu.",
            "bâti exclusivement de carton et de café.",
            "prise 43... action.",
            "j'ai fait des études pour ça.",
            "on arrangera mon visage en post-prod.",
            "ça brûle !          je plaisante",
            "la lumière était vraiment belle ce jour-là.",
            "primé (à ce qu'il paraît).",
            "plus fort !",
            "maintenant avec 20% de magenta en plus.",
            "contient de petits éléments. risque d'étouffement.",
            "récidive",
            "bip boop. attends, je suis humain.",
            "pourquoi es-tu encore là ?",
            "tu as trouvé le dialogue secret ! (il n'y a rien à gagner).",
            "ne pas nourrir après minuit"
        ];

        document.getElementById('head-idle').addEventListener('click', function() {
            if (isTransitioning) return;
            
            const bubble = document.getElementById('speech-bubble');
            clearTimeout(bubbleTypeTimeout);
            
            bubble.classList.remove('show');
            bubble.innerHTML = ''; 
            
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * phrases.length);
            } while (newIndex === lastPhraseIndex);
            lastPhraseIndex = newIndex;
            
            const selectedText = phrases[newIndex];
            void bubble.offsetWidth; 
            bubble.classList.add('show');
            
            let i = 0;
            function typeBubble() {
                let visiblePart = selectedText.substring(0, i);
                let hiddenPart = selectedText.substring(i);
                bubble.innerHTML = visiblePart + '<span style="visibility: hidden;">' + hiddenPart + '</span>';
                
                if (i < selectedText.length) {
                    i++;
                    bubbleTypeTimeout = setTimeout(typeBubble, 25);
                }
            }
            typeBubble();
        });

        // ==========================================
        // TOGGLE SWITCH (FR -> EN)
        // ==========================================
        (function() {
            const toggle = document.getElementById('lang-switch');
            const knob = document.getElementById('lang-switch-knob');
            if (!toggle || !knob) return;

            let isDragging = false;
            let startX = 0;
            let currentX = 20;
            let hasMoved = false;
            const maxTravel = 20;

            function updateKnob(pos) {
                currentX = Math.max(0, Math.min(maxTravel, pos));
                knob.style.transform = `translateX(${currentX}px)`;
                const ratio = currentX / maxTravel;
                const r = Math.round(233 + (255 - 233) * ratio);
                const g = Math.round(233 + (0 - 233) * ratio);
                const b = Math.round(234 + (255 - 234) * ratio);
                toggle.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
                toggle.style.boxShadow = `inset 0 0 0 1.5px rgb(${r}, ${g}, ${b})`;
            }

            function triggerSwitch() {
                if (isTransitioning) return;
                isTransitioning = true;
                toggle.classList.remove('is-on');
                toggle.setAttribute('aria-checked', 'false');
                toggle.style.backgroundColor = '';
                toggle.style.boxShadow = '';
                knob.style.transform = 'translateX(0px)';
                
                document.body.style.pointerEvents = 'none';
                
                const isHtmlEnv = window.location.pathname.endsWith('.html') || window.location.protocol === 'file:';
                const targetUrl = isHtmlEnv ? 'index.html?return=true' : './?return=true';
                
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 220);
            }

            function resetSwitch() {
                toggle.classList.add('is-on');
                toggle.setAttribute('aria-checked', 'true');
                toggle.style.backgroundColor = '';
                toggle.style.boxShadow = '';
                knob.style.transform = '';
            }

            toggle.addEventListener('pointerdown', (e) => {
                if (isTransitioning) return;
                isDragging = true;
                hasMoved = false;
                startX = e.clientX;
                currentX = maxTravel;
                toggle.classList.add('is-dragging');
                try {
                    toggle.setPointerCapture(e.pointerId);
                } catch (err) {}
            });

            toggle.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - startX;
                if (Math.abs(deltaX) > 3) {
                    hasMoved = true;
                }
                updateKnob(maxTravel + deltaX);
            });

            function onPointerEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                toggle.classList.remove('is-dragging');
                try {
                    toggle.releasePointerCapture(e.pointerId);
                } catch (err) {}

                if (!hasMoved) {
                    triggerSwitch();
                } else {
                    if (currentX <= maxTravel * 0.5) {
                        triggerSwitch();
                    } else {
                        resetSwitch();
                    }
                }
            }

            toggle.addEventListener('pointerup', onPointerEnd);
            toggle.addEventListener('pointercancel', onPointerEnd);

            toggle.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    triggerSwitch();
                }
            });
        })();
    </script>
</body>
</html>
