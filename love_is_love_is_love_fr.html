            font-family: var(--font-condensed);
            font-size: clamp(10px, 1.4vh, 14px);

            border-radius: 20px;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            transition: background-color 0.2s ease, color 0.2s ease;

        .poster-back-btn:hover {
            background-color: var(--white);
            color: var(--red);
        }

            flex: 1 1 auto;
            width: 100%;
            height: calc(100vh - var(--top-bar-h));
            height: calc(100dvh - var(--top-bar-h));
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .body-white-zone {
            flex: 2 1 0;
            height: 66.6667%;
            background-color: var(--white);
            width: 100%;
        }

        .body-red-zone {
            flex: 1 1 0;
            height: 33.3333%;
            background-color: var(--red);
            width: 100%;
        }

        #text-stage {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            pointer-events: none;
            z-index: 15;
        }

        .text-line {
            position: absolute;
            left: 0;
            right: 0;
            display: block;
            pointer-events: none;
        }

        .text-segment {
            position: absolute;
            top: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            font-family: var(--font-text);
            font-weight: 400;
            pointer-events: none;
        }

        .text-segment.segment-black {
            color: var(--black);
        }

        .text-segment.segment-white {
            color: var(--white);
        }

        .text-segment a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 4px;
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.2s ease, text-decoration-color 0.2s ease;
        }

        .text-segment a:hover {
            opacity: 0.65;
            text-decoration-color: var(--red);
        }

        .text-segment a:focus-visible,
        .poster-back-btn:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 3px;
        }

        /* Underlined credit categories */
        .credit-cat {
            text-decoration: underline;
            text-underline-offset: 3px;
            font-weight: 600;
        }

            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: left bottom;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;

                for (const [em, indices] of emGroups.entries()) {
                    const tokFS = baseFS * em;
                    ctx.font = `${CONFIG.fontWeight} ${tokFS}px ${CONFIG.fontFamily}`;
                    spaceWidths.set(em, Math.ceil(ctx.measureText(' ').width * 1.10));
                    for (let j = 0; j < indices.length; j++) {
                        const idx = indices[j];
                        tokenWidths[idx] = Math.ceil(ctx.measureText(tokens[idx].text).width * 1.10) + 1;
                    }
                }

                while (tIdx < tokens.length) {
                    const currentEm = tokens[tIdx].em;
                    const fs = baseFS * currentEm;
                    const lineH = Math.round(fs * 1.35);

                    if (curY + lineH > whiteBottom) {
                        return { fits: false, lines: lines };
                    }

                    const segs = getLineSegments(curY, curY + lineH);
                    let lineHadWord = false;
                    let blockFinishedOnLine = false;
                    const lineSegmentsData = [];

                    for (let s = 0; s < segs.length; s++) {
                        if (blockFinishedOnLine) break;
                        const segW = segs[s].width;
                        let curW = 0;
                        const segTokens = [];

                        while (tIdx < tokens.length) {
                            const tok = tokens[tIdx];
                            const wW = tokenWidths[tIdx];
                            const spaceW = spaceWidths.get(tok.em) || 4;
                            const needed = segTokens.length === 0 ? wW : (curW + spaceW + wW);

                            // STRICT FIT: Word MUST fit inside segment with safety padding
                            if (needed <= segW - activeSettings.safetyPad) {
                                curW = needed;
                                segTokens.push(tok);
                                tIdx++;
                                lineHadWord = true;
                                if (tok.breakAfter) {
                                    blockFinishedOnLine = true;
                                    break;
                                }
                            } else {
                                break;
                            }
                        }

                        if (segTokens.length > 0) {
                            lineSegmentsData.push({
                                left: segs[s].left,
                                width: segW,
                                tokens: segTokens
                            });
                        }
                    }

                    if (!lineHadWord) {
                        curY += Math.max(6, Math.round(lineH * 0.4));
                        if (curY + lineH > whiteBottom) {
                            return { fits: false, lines: lines };
                        }
                        continue;
                    }

                    lines.push({
                        top: curY,
                        height: lineH,
                        fontSize: fs,
                        segments: lineSegmentsData
                    });
                    curY += lineH;
                }

                return {
                    fits: (tIdx >= tokens.length),
                    lines: lines,
                    totalHeight: curY - (whiteTop + padY)
                };
            }

            function findOptimalWhiteBaseFS(whiteTop, whiteHeight, tokens, isMobile) {
                let low = 4.0;
                let high = isMobile ? 30.0 : 35.0;
                let bestResult = null;

                for (let iter = 0; iter < 25; iter++) {
                    const mid = +((low + high) / 2).toFixed(2);
                    const res = simulateWhiteLayout(mid, whiteTop, whiteHeight, tokens);

                    if (res.fits) {
                        bestResult = res;
                        bestResult.baseFS = mid;
                        low = mid; // Try larger font size to fill vertical space
                    } else {
                        high = mid; // Too large, text overflowed
                    }
                }

                if (!bestResult) {
                    bestResult = simulateWhiteLayout(4.0, whiteTop, whiteHeight, tokens);
                    bestResult.baseFS = 4.0;
                }
                return bestResult;
            }

            // 10. RED ZONE SINGLE-SCALE SIMULATION & LAYOUT
            function simulateRedLayout(fontSize, redTop, redHeight) {
                const lineH = Math.round(fontSize * 1.30);
                const minPad = activeSettings.padX;
                const usableH = Math.max(0, redHeight - 2 * minPad);
                const lineCount = Math.floor(usableH / lineH);
                if (lineCount <= 0) return { fits: false, lines: [] };

                const startY = redTop + minPad;

                ctx.font = `${CONFIG.fontWeight} ${fontSize}px ${CONFIG.fontFamily}`;
                const spaceW = Math.ceil(ctx.measureText(' ').width * 1.10);
                const tokenWidths = new Float32Array(RED_TOKENS.length);
                for (let i = 0; i < RED_TOKENS.length; i++) {
                    tokenWidths[i] = Math.ceil(ctx.measureText(RED_TOKENS[i].text).width * 1.10) + 1;
                }

                let tIdx = 0;
                const lines = [];

                for (let l = 0; l < lineCount; l++) {
                    const lineTop = startY + l * lineH;
                    const lineBottom = lineTop + lineH;
                    const segs = getLineSegments(lineTop, lineBottom);
                    const lineSegmentsData = [];

                    for (let s = 0; s < segs.length; s++) {
                        const segW = segs[s].width;
                        let curW = 0;
                        const segTokens = [];

                        while (tIdx < RED_TOKENS.length) {
                            const tok = RED_TOKENS[tIdx];
                            const wW = tokenWidths[tIdx];
                            const needed = segTokens.length === 0 ? wW : (curW + spaceW + wW);

                            // STRICT FIT: Word MUST fit inside segment with safety padding
                            if (needed <= segW - activeSettings.safetyPad) {
                                curW = needed;
                                segTokens.push(tok);
                                tIdx++;
                            } else {
                                break;
                            }
                        }

                        if (segTokens.length > 0) {
                            lineSegmentsData.push({
                                left: segs[s].left,
                                width: segW,
                                tokens: segTokens
                            });
                        }
                    }

                    if (lineSegmentsData.length > 0) {
                        lines.push({
                            top: lineTop,
                            height: lineH,
                            fontSize: fontSize,
                            segments: lineSegmentsData
                        });
                    }
                }

                return { fits: (tIdx >= RED_TOKENS.length), lines: lines };
            }

            function findOptimalRedFS(redTop, redHeight) {
                let low = 4.0;
                let high = 35.0;
                let bestResult = null;

                for (let iter = 0; iter < 20; iter++) {
                    const mid = +((low + high) / 2).toFixed(2);
                    const res = simulateRedLayout(mid, redTop, redHeight);

                    if (res.fits) {
                        bestResult = res;
                        bestResult.fontSize = mid;
                        low = mid; // Try larger font to fill more vertical space
                    } else {
                        high = mid; // Too large, word overflowed segment
                    }
                }

                if (!bestResult) {
                    bestResult = simulateRedLayout(4.0, redTop, redHeight);
                    bestResult.fontSize = 4.0;
                }
                return bestResult;
            }

            // 11. HTML RENDERERS FOR WHITE & RED SEGMENTS
            function renderWhiteHTML(tokens) {
                let html = '';
                let currentHref = null;
                let linkWords = [];

                function flushLink() {
                    if (currentHref) {
                        const isExt = currentHref.startsWith('http');
                        const targetAttr = isExt ? ' target="_blank" rel="noopener noreferrer"' : '';
                        html += `<a href="${currentHref}"${targetAttr}>${linkWords.join(' ')}</a> `;
                    } else {
                        html += linkWords.join(' ') + ' ';
                    }
                    linkWords = [];
                    currentHref = null;
                }

                for (let i = 0; i < tokens.length; i++) {
                    const tok = tokens[i];
                    if (tok.href !== currentHref) {
                        if (linkWords.length > 0) flushLink();
                        currentHref = tok.href;
                    }
                    linkWords.push(tok.text);
                }
                if (linkWords.length > 0) flushLink();
                return html.trim();
            }

            function renderRedHTML(tokens) {
                return tokens.map(tok => {
                    if (tok.isCat) {
                        return `<span class="credit-cat">${tok.text}</span>`;
                    }
                    return tok.text;
                }).join(' ');
            }

            // 12. STAGE INITIALIZATION & MULTI-SCALE DYNAMIC REFLOW
            function setupStage() {
                stageW = window.innerWidth;
                stageH = window.innerHeight;

                const topBarEl = document.querySelector('.poster-top-bar');
                const headerH = topBarEl ? topBarEl.getBoundingClientRect().height : Math.round(stageH * 0.12);
                const mainBodyEl = document.querySelector('.poster-main-body');
                const mainBodyH = mainBodyEl ? mainBodyEl.getBoundingClientRect().height : (stageH - headerH);
                const whiteZoneEl = document.querySelector('.body-white-zone');
                const whiteZoneH = whiteZoneEl ? whiteZoneEl.getBoundingClientRect().height : Math.round(mainBodyH * (2 / 3));
                const redZoneH = mainBodyH - whiteZoneH;
                const splitY = headerH + whiteZoneH;

                const isMobile = stageW < 768 || (stageW / stageH < 0.85);

                // Responsive geometry parameters (allows text into tight corners & close to borders on mobile)
                const padX = isMobile ? Math.max(10, Math.min(16, Math.round(stageW * 0.035))) : CONFIG.padX;
                const buffer = isMobile ? 6 : CONFIG.buffer;
                const minSegWidth = isMobile ? Math.max(20, Math.min(30, Math.round(stageW * 0.055))) : CONFIG.minSegWidth;
                const safetyPad = isMobile ? 6 : CONFIG.safetyPad;

                activeSettings = { padX, buffer, minSegWidth, safetyPad };

                // Ground-anchored cutout sizing & positioning
                if (isMobile) {
                    // Mobile / portrait viewports:
                    // Scale cutout height so it anchors at the bottom without blocking the entire screen width
                    const targetHRatio = Math.min(0.56, Math.max(0.48, (stageW / stageH) * 1.05));
                    cardH = Math.round(stageH * targetHRatio);
                    cardW = Math.round(cardH * CONFIG.aspectRatio);

                    // Ensure cardW never exceeds 82% of stageW so a clear vertical text column is guaranteed
                    if (cardW > stageW * 0.82) {
                        cardW = Math.round(stageW * 0.82);
                        cardH = Math.round(cardW / CONFIG.aspectRatio);
                    }
                    cardY = stageH - cardH;

                    // Align cutout to the right / center-right side:
                    // Her head is around normalized x=0.67 and right body edge is ~0.85.
                    // This creates an open column on the left where trailer links and red credits cascade cleanly.
                    cardX = Math.round(stageW - 0.84 * cardW);
                } else {
                    // Desktop / landscape screens: original full-height ground-anchored style
                    cardH = Math.round(stageH * (CONFIG.heightRatio || 0.85));
                    cardW = Math.round(cardH * CONFIG.aspectRatio);
                    cardY = stageH - cardH;

                    const minSilhouetteX = 0.070;
                    const elbowTouchX = -Math.round(minSilhouetteX * cardW);
                    const centeredX = Math.round((stageW - cardW) / 2);

                    if (stageW >= cardW) {
                        cardX = centeredX;
                    } else {
                        cardX = Math.max(elbowTouchX, stageW - cardW);
                    }
                }

                updateCardDOM();

                // Compute layout for both zones
                // A. WHITE ZONE (Multi-scale: title, starring, synopsis, trailer/teaser links)
                const activeTokens = getActiveWhiteTokens(isMobile);
                const whiteLayout = findOptimalWhiteBaseFS(headerH, whiteZoneH, activeTokens, isMobile);

                // B. RED ZONE (Credits list, single scale)
                const redLayout = findOptimalRedFS(splitY, redZoneH);

                // Build DOM nodes off-DOM using a DocumentFragment to eliminate layout thrashing
                const fragment = document.createDocumentFragment();

                whiteLayout.lines.forEach(line => {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'text-line';
                    lineDiv.style.top = `${line.top}px`;
                    lineDiv.style.height = `${line.height}px`;

                    line.segments.forEach(seg => {
                        const spanEl = document.createElement('span');
                        spanEl.className = 'text-segment segment-black';
                        spanEl.style.left = `${Math.round(seg.left)}px`;
                        spanEl.style.width = `${Math.round(seg.width)}px`;
                        spanEl.style.fontSize = `${line.fontSize}px`;
                        spanEl.style.lineHeight = `${line.height}px`;
                        spanEl.innerHTML = renderWhiteHTML(seg.tokens);
                        lineDiv.appendChild(spanEl);
                    });
                    fragment.appendChild(lineDiv);
                });

                redLayout.lines.forEach(line => {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'text-line';
                    lineDiv.style.top = `${line.top}px`;
                    lineDiv.style.height = `${line.height}px`;

                    line.segments.forEach(seg => {
                        const spanEl = document.createElement('span');
                        spanEl.className = 'text-segment segment-white';
                        spanEl.style.left = `${Math.round(seg.left)}px`;
                        spanEl.style.width = `${Math.round(seg.width)}px`;
                        spanEl.style.fontSize = `${line.fontSize}px`;
                        spanEl.style.lineHeight = `${line.height}px`;
                        spanEl.innerHTML = renderRedHTML(seg.tokens);
                        lineDiv.appendChild(spanEl);
                    });
                    fragment.appendChild(lineDiv);
                });

                // Atomic DOM replacement
                if (stage.replaceChildren) {
                    stage.replaceChildren(fragment);
                } else {
                    stage.innerHTML = '';
                    stage.appendChild(fragment);
                }
            }

            function updateCardDOM() {
                card.style.transform = `translate3d(${Math.round(cardX)}px, ${Math.round(cardY)}px, 0)`;
                card.style.width = `${Math.round(cardW)}px`;
                card.style.height = `${Math.round(cardH)}px`;
            }

            // 13. DOM SYNCHRONIZATION FOR CONTENT & ACCESSIBILITY
            function syncContentWithDOM() {
                const titleEl = document.getElementById('poster-title-text');
                if (titleEl && POSTER_DATA.header.title) {
                    titleEl.textContent = POSTER_DATA.header.title;
                    const svgEl = titleEl.closest('svg');
                    if (svgEl) svgEl.setAttribute('aria-label', POSTER_DATA.header.title);
                }

                const backBtnEl = document.getElementById('poster-back-btn');
                if (backBtnEl && POSTER_DATA.header.backButton) {
                    backBtnEl.textContent = POSTER_DATA.header.backButton.label;
                    backBtnEl.href = POSTER_DATA.header.backButton.href;
                }

                if (cardImg && POSTER_DATA.cutout) {
                    if (POSTER_DATA.cutout.src && cardImg.getAttribute('src') !== POSTER_DATA.cutout.src) {
                        cardImg.src = POSTER_DATA.cutout.src;
                    }
                    if (POSTER_DATA.cutout.alt) {
                        cardImg.alt = POSTER_DATA.cutout.alt;
                    }
                }

                // Accessible screen reader section
                const srEl = document.getElementById('accessible-poster-content');
                if (srEl) {
                    let srHtml = `<h1>${POSTER_DATA.header.title}</h1>`;
                    POSTER_DATA.whiteZone.forEach(block => {
                        if (block.href) {
                            srHtml += `<p><a href="${block.href}">${block.text}</a></p>`;
                        } else {
                            srHtml += `<p>${block.text}</p>`;
                        }
                    });
                    srHtml += `<h2>Credits</h2><pre>${POSTER_DATA.redCredits.trim()}</pre>`;
                    srEl.innerHTML = srHtml;
                }
            }

            // 14. UNIFIED SCHEDULER & EVENT LISTENERS
            let rafId = null;
            function scheduleStageUpdate() {
                if (rafId !== null) cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(() => {
                    rafId = null;
                    setupStage();
                });
            }

            // Window resize (passive, debounced with requestAnimationFrame)
            window.addEventListener('resize', scheduleStageUpdate, { passive: true });

            // Font readiness listener
            if (document.fonts) {
                document.fonts.ready.then(scheduleStageUpdate);
            }

            // Cutout image load listener
            if (!cardImg.complete) {
                cardImg.addEventListener('load', scheduleStageUpdate, { once: true });
            }

            // 15. BOOTSTRAP
            if (document.referrer && document.referrer.includes('index.html') && !document.referrer.includes('_fr')) {
                const backBtn = document.getElementById('poster-back-btn');
                if (backBtn) backBtn.href = 'index.html?return=true';
            }
            syncContentWithDOM();
            scheduleStageUpdate();
        })();
    </script>
</body>
</html>
