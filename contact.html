<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background-color: #f2f2f2;
            color: #111111;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center; /* Centre verticalement */
            padding: 6vh 6vw;
            user-select: none;
            -webkit-user-select: none;
        }

        /* TRANSITION FONDU AU NOIR */
        .black-fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* Part du noir pur */
            z-index: 9999;
            pointer-events: none; /* Laisse passer les clics une fois invisible */
            animation: fadeOutBlack 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes fadeOutBlack {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* BOUTON RETOUR (Pillule Rose) */
        .back-btn {
            position: absolute;
            top: 40px;
            right: 40px;
            -webkit-appearance: none;
            appearance: none;
            border: none;
            display: inline-block;
            background-color: #111111;
            color: #ffffff;
            font-family: "Libre Franklin", sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: lowercase;
            text-decoration: none;
            letter-spacing: 0.5px;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .back-btn:hover {
            background-color: #ff00ff; /* Devient rose au survol */
            transform: scale(1.05);
        }

        .back-btn:active {
            transform: scale(0.97);
        }

        /* INDEX GÉANT DES CONTACTS */
        .contact-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
        }

        .contact-item {
            position: relative;
            display: flex;
            align-items: flex-start;
        }

        /* Le petit numéro technique devant le lien (ex: 01) */
        .contact-index {
            font-family: "Libre Franklin", sans-serif;
            font-weight: 700;
            font-size: 12px;
            color: #111111;
            margin-top: 1vw; /* Aligne avec le haut des grosses lettres */
            margin-right: 2vw;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        /* La typographie massive */
        .contact-link {
            font-family: "Libre Franklin", sans-serif;
            font-weight: 900;
            /* Le texte s'adapte à la taille de l'écran (clamp = min, fluide, max) */
            font-size: clamp(3rem, 9vw, 9rem); 
            line-height: 0.85;
            letter-spacing: -0.04em;
            color: #111111;
            text-decoration: none;
            text-transform: lowercase;
            transition: color 0.2s ease, transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            transform-origin: left center;
        }

        /* INTERACTIONS AU SURVOL */
        .contact-item:hover .contact-link {
            color: #ff00ff;
            transform: translateX(1.5vw); /* Décale le texte vers la droite */
        }

        .contact-item:hover .contact-index {
            color: #ff00ff;
            opacity: 1;
        }

        /* MEDIA QUERY POUR MOBILE */
        @media (max-width: 768px) {
            .back-btn {
                top: 20px;
                right: 20px;
            }
            
            .contact-container {
                margin-top: 80px;
            }
            
            .contact-list {
                gap: 3vh;
            }
            
            .contact-index {
                margin-top: 2vw;
                margin-right: 4vw;
            }
        }
    </style>
</head>
<body>

    <!-- L'écran noir qui disparaît au chargement -->
    <div class="black-fade-overlay"></div>

    <!-- Bouton pour revenir à l'accueil/CV -->
    <a href="index.html" class="back-btn">retour</a>

    <div class="contact-container">
        <ul class="contact-list">
            
            <!-- ÉLÉMENT 1 : MAIL -->
            <li class="contact-item">
                <span class="contact-index">01</span>
                <a href="mailto:eliott.croubalian@gmail.com" class="contact-link">mail</a>
            </li>

            <!-- ÉLÉMENT 2 : LINKEDIN -->
            <li class="contact-item">
                <span class="contact-index">02</span>
                <a href="https://www.linkedin.com/in/eliott-croubalian/" target="_blank" class="contact-link">linkedin</a>
            </li>

            <!-- ÉLÉMENT 3 : YOUTUBE -->
            <li class="contact-item">
                <span class="contact-index">03</span>
                <a href="https://www.youtube.com/@eliottcroubalian2495" target="_blank" class="contact-link">youtube</a>
            </li>

            <!-- POUR AJOUTER UN NOUVEAU LIEN PLUS TARD :
                 Copie simplement ce bloc <li> ci-dessous, modifie le numéro, l'URL (href) et le texte. 
            <li class="contact-item">
                <span class="contact-index">04</span>
                <a href="https://instagram.com/..." target="_blank" class="contact-link">instagram</a>
            </li>
            -->

        </ul>
    </div>

</body>
</html>
