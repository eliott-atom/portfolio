<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact | Eliott Atom Croubalian</title>
    <meta name="description" content="Contacter Eliott Atom Croubalian par e-mail, LinkedIn ou YouTube.">
    <link rel="canonical" href="https://eliott-atom.ch/contact_fr">
    <link rel="alternate" hreflang="en" href="https://eliott-atom.ch/contact">
    <link rel="alternate" hreflang="fr" href="https://eliott-atom.ch/contact_fr">
    <link rel="alternate" hreflang="x-default" href="https://eliott-atom.ch/contact">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact | Eliott Atom Croubalian">
    <meta property="og:description" content="Contacter Eliott Atom Croubalian par e-mail, LinkedIn ou YouTube.">
    <meta property="og:url" content="https://eliott-atom.ch/contact_fr">
    <meta property="og:image" content="https://eliott-atom.ch/tete-centre.webp">
    <meta property="og:locale" content="fr_CH">
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-light.png?v=3">
    <link rel="shortcut icon" href="favicon.ico?v=3">
    <link rel="apple-touch-icon" href="favicon-light.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script>
        try {
            if (window.location.protocol.startsWith('http') && window.location.pathname.endsWith('.html')) {
                let clean = window.location.pathname.replace(/\/index\.html$/, '/').replace(/\.html$/, '');
                if (!clean) clean = '/';
                window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
            }
        } catch (e) {}
    </script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }


        /* TRANSITION FONDU AU NOIR */
        .black-fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            pointer-events: none;
            animation: fadeOutBlack 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes fadeOutBlack {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* TOP NAV (RETOUR + LANG SWITCH) */
        .top-nav-group {
            position: absolute;
            top: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 100;
        }

        /* BOUTON RETOUR */
        .back-btn {
            -webkit-appearance: none;
            appearance: none;
            border: none;
            display: inline-block;
            background-color: #111111;
            color: #ffffff;
            font-family: "Libre Franklin", sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: lowercase;
            text-decoration: none;
            letter-spacing: 0.5px;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .back-btn:hover {
            background-color: #ff00ff;
            transform: scale(1.05);
        }

        .back-btn:active {
            transform: scale(0.97);
        }

        .lang-switch {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: 500;
            text-transform: lowercase;
            color: #111111;
            display: flex;
            align-items: baseline;
            user-select: none;
            -webkit-user-select: none;
        }

        .lang-switch a,
        .lang-switch span {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .lang-switch a {
            cursor: pointer;
        }

        .lang-switch .is-active {
            font-weight: 900;
            cursor: default;
            pointer-events: none;
        }

        .lang-switch a:hover {
            color: #ff00ff;
            font-weight: 900;
        }

        .lang-switch .lang-sep {
            color: #ffffff;
            font-weight: 500;
            cursor: default;
            pointer-events: none;
        }
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 6vh 6vw;
            user-select: none;
            -webkit-user-select: none;
        }



        /* TOP NAV (RETOUR + LANG SWITCH) */
        .top-nav-group {
            position: absolute;
            top: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 100;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12vw 4vw 8vw 4vw;
        }

        .header {
            margin-bottom: 6vw;
        }

        .header h1 {
            font-weight: 900;
            font-size: 6vw;
            line-height: 1;
            text-transform: lowercase;
            letter-spacing: -0.02em;
        }

        .header p {
            margin-top: 1.5vw;
            color: #888888;
            text-transform: lowercase;
            max-width: 500px;
        }

        /* --- MASONRY / GRID FEED --- */
        .wip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            column-gap: 3vw;
            row-gap: 6vw;
        }

        .wip-item {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .wip-media {
            width: 100%;
            background-color: #111111;
            /* Remove aspect-ratio if you want varying heights like a real pin-up board */
            aspect-ratio: 4 / 5; 
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        .wip-item:hover .wip-media {
            filter: grayscale(100%) contrast(1.2);
        }

        .wip-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            text-transform: lowercase;
        }

        .wip-date {
            font-family: "Libre Franklin", sans-serif;
            font-weight: 900;
            color: #ff00ff;
            font-size: 14px;
        }

        .wip-title {
            font-weight: 500;
            font-size: 16px;
        }

        /* --- MOBILE ADAPTATION --- */
        @media (max-aspect-ratio: 4/5), (max-width: 768px) {
            .container {
                padding-top: 20vw;
            }
            .header h1 {
                font-size: 12vw;
            }
            .header p {
                font-size: 15px;
                margin-top: 4vw;
            }
            .wip-grid {
                grid-template-columns: 1fr;
                row-gap: 10vw;
            }
        }
    
    </style>
</head>
<body>

    <div class="black-fade-overlay"></div>

    <!-- Navigation haut-droite : retour + switch langue -->
    <div class="top-nav-group">
        <a href="index_fr.html?return=true" class="back-btn">retour</a>
        <nav class="lang-switch" aria-label="Choix de la langue">
            <span class="is-active" aria-current="page">en</span><span class="lang-sep">/</span><a href="work_fr">fr</a>
        </nav>
    </div>

    <div class="container">
        <header class="header">
            <h1>work in progress</h1>
        </header>
        </div>
</body>

</html>
