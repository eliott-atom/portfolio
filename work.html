<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing | Eliott Atom Croubalian</title>
    <meta name="description" content="A library of writing, portfolios, and publications by Eliott Atom Croubalian.">
    <link rel="canonical" href="https://eliott-atom.ch/work">
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-light.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script>
        try {
            if (window.location.protocol.startsWith('http') && window.location.pathname.endsWith('.html')) {
                let clean = window.location.pathname.replace(/\/work\.html$/, '/work').replace(/\.html$/, '');
                if (!clean) clean = '/';
                window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
            }
        } catch (e) {}
    </script>
    <style>
        :root {
            --page-bg: #f3f3f3;
            --ink: #111111;
            --accent: #ff00ff;
            --accent-top: #ff55ff;
            --accent-side: #d900d9;
            --accent-bottom: #9e009e;

            /* Fixed, identical cube dimensions for all blocks */
            --slab-w: 390px;
            --slab-d: 350px;
            --slab-h: 88px;

            /* Architectural view angle */
            --stage-pitch: 17deg;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: var(--page-bg);
            color: var(--ink);
            scroll-behavior: auto;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            background: var(--page-bg);
            color: var(--ink);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* Black entrance fade */
        .black-fade-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
            pointer-events: none;
            animation: fadeOutBlack .8s cubic-bezier(.165,.84,.44,1) forwards;
        }

        @keyframes fadeOutBlack {
            to { opacity: 0; visibility: hidden; }
        }

        /* Top navigation */
        .top-nav-group {
            position: fixed;
            top: 36px;
            right: 40px;
            z-index: 100;
        }

        .back-btn {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 30px;
            background: var(--ink);
            color: #fff;
            font: 700 11px "Libre Franklin", sans-serif;
            letter-spacing: .5px;
            text-decoration: none;
            text-transform: lowercase;
            transition: background-color .2s ease, transform .2s ease;
        }

        .back-btn:hover {
            background: var(--accent);
            transform: scale(1.05);
        }

        .scroll-hint {
            position: fixed;
            bottom: 32px;
            left: 40px;
            z-index: 50;
            font: 700 10px "Libre Franklin", sans-serif;
            letter-spacing: .08em;
            text-transform: lowercase;
            color: var(--ink);
            opacity: 0.45;
            pointer-events: none;
        }

        .scroll-counter {
            position: fixed;
            bottom: 32px;
            right: 40px;
            z-index: 50;
            font: 700 11px "Libre Franklin", sans-serif;
            letter-spacing: .05em;
            color: var(--ink);
            opacity: 0.45;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
        }

        .safari-library {
            display: none;
        }

        .is-safari .scroll-container {
            min-height: 100vh;
            padding: 18vh 8vw 10vh;
        }

        .is-safari .stage-viewport,
        .is-safari .scroll-hint,
        .is-safari .scroll-counter {
            display: none;
        }

        .is-safari .safari-library {
            display: block;
            width: min(100%, 900px);
            margin: 0 auto;
        }

        .safari-library-list {
            list-style: none;
        }

        .safari-library-item {
            border-bottom: 1px solid rgba(17, 17, 17, .18);
        }

        .safari-library-link,
        .safari-library-unavailable {
            display: block;
            padding: 18px 0;
            color: var(--ink);
            font: 900 clamp(24px, 5vw, 58px)/.95 "Libre Franklin", sans-serif;
            letter-spacing: -.04em;
            text-decoration: none;
            text-transform: lowercase;
        }

        .safari-library-link:hover {
            color: var(--accent);
        }

        .safari-library-unavailable {
            color: #999;
        }

        @media (max-width: 700px) {
            .is-safari .scroll-container {
                padding: 120px 24px 80px;
            }
        }

        /* Scroll track */
        .scroll-container {
            position: relative;
            width: 100%;
        }

        /* Sticky 3D Viewport with monolithic silhouette outline */
        .stage-viewport {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1200px;
            perspective-origin: 50% 10%;
            pointer-events: none;
            /* One continuous silhouette outline around the entire monolithic column */
            filter: drop-shadow(1px 0 0 #111)
                    drop-shadow(-1px 0 0 #111)
                    drop-shadow(0 1px 0 #111)
                    drop-shadow(0 -1px 0 #111)
                    drop-shadow(0 16px 36px rgba(0, 0, 0, 0.12));
        }

        /* 3D World container */
        .stage-world {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: rotateX(var(--stage-pitch));
            pointer-events: auto;
        }

        /* The monolithic sculptural column */
        .sculpture-column {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: translateY(var(--column-y, 0px)) rotateY(var(--column-rot-y, 0deg));
            will-change: transform;
        }

        /* Individual slab container in the pile */
        .slab {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            transform: translate3d(
                var(--slab-x, 0px),
                var(--slab-y, 0px),
                var(--slab-z, 0px)
            )
            rotateY(var(--slab-base-rot, 0deg));
            will-change: transform;
        }

        /* Slab anchor link - strictly fixed dimensions */
        .slab-anchor {
            position: absolute;
            left: calc(var(--slab-w) / -2);
            top: calc(var(--slab-h) / -2);
            width: var(--slab-w);
            height: var(--slab-h);
            display: block;
            transform-style: preserve-3d;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            outline: none;
        }

        .slab.is-empty,
        .slab.is-empty .slab-anchor {
            pointer-events: none;
            cursor: default;
        }

        .slab-anchor:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 6px;
        }

        /* 3D Box construction */
        .slab-box {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Faces: NO border lines between cubes so the column forms one solid object */
        .slab-face {
            position: absolute;
            backface-visibility: hidden;
            border: none;
            overflow: hidden;
            transition: background-color .18s ease, color .18s ease;
        }

        /* 1. FRONT FACE (Title surface) */
        .slab-front {
            inset: 0;
            width: var(--slab-w);
            height: var(--slab-h);
            transform: translateZ(calc(var(--slab-d) / 2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            background: #e4e4e4;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        /* 2. BACK FACE */
        .slab-back {
            inset: 0;
            width: var(--slab-w);
            height: var(--slab-h);
            transform: rotateY(180deg) translateZ(calc(var(--slab-d) / 2));
            background: #cecece;
        }

        /* 3. TOP FACE */
        .slab-top {
            left: 0;
            top: calc(50% - var(--slab-d) / 2);
            width: var(--slab-w);
            height: var(--slab-d);
            transform: rotateX(90deg) translateZ(calc(var(--slab-h) / 2));
            background: #efefef;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.6);
        }

        /* 4. BOTTOM FACE */
        .slab-bottom {
            left: 0;
            top: calc(50% - var(--slab-d) / 2);
            width: var(--slab-w);
            height: var(--slab-d);
            transform: rotateX(-90deg) translateZ(calc(var(--slab-h) / 2));
            background: #b2b2b2;
        }

        /* 5. RIGHT FACE */
        .slab-right {
            top: 0;
            left: calc(50% - var(--slab-d) / 2);
            width: var(--slab-d);
            height: var(--slab-h);
            transform: rotateY(90deg) translateZ(calc(var(--slab-w) / 2));
            background: #c8c8c8;
        }

        /* 6. LEFT FACE */
        .slab-left {
            top: 0;
            left: calc(50% - var(--slab-d) / 2);
            width: var(--slab-d);
            height: var(--slab-h);
            transform: rotateY(-90deg) translateZ(calc(var(--slab-w) / 2));
            background: #dadada;
        }

        /* Typography: BIG text filling the face to the brim */
        .slab-title {
            width: 100%;
            text-align: center;
            font-family: "Libre Franklin", sans-serif;
            font-weight: 600;
            line-height: 0.98;
            letter-spacing: -0.04em;
            text-transform: lowercase;
            color: var(--ink);
            word-break: break-word;
            hyphens: auto;
            transition: color .18s ease;
        }

        .slab-badge {
            display: block;
            margin-top: 4px;
            font-family: "Libre Franklin", sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #777;
        }

        /* Hover Feedback */
        .slab.is-available:hover .slab-front {
            background: var(--accent);
        }

        .slab.is-available:hover .slab-top {
            background: var(--accent-top);
        }

        .slab.is-available:hover .slab-right {
            background: var(--accent-side);
        }

        .slab.is-available:hover .slab-left {
            background: #e600e6;
        }

        .slab.is-available:hover .slab-bottom {
            background: var(--accent-bottom);
        }

        .slab.is-available:hover .slab-title {
            color: #000;
        }

        /* Unavailable Documents */
        .slab.is-unavailable {
            opacity: 0.45;
        }

        .slab.is-unavailable .slab-anchor {
            cursor: not-allowed;
        }

        .slab.is-unavailable .slab-front {
            background: #dcdcdc;
            color: #666;
        }

        .slab.is-unavailable .slab-top {
            background: #e4e4e4;
        }

        .slab.is-unavailable .slab-right {
            background: #bebebe;
        }

        .slab.is-unavailable .slab-left {
            background: #cccccc;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            :root {
                --slab-w: min(320px, 82vw);
                --slab-d: min(290px, 75vw);
                --slab-h: 74px;
                --stage-pitch: 15deg;
            }

            .top-nav-group {
                top: 20px;
                right: 20px;
            }

            .slab-front {
                padding: 6px 14px;
            }
        }

        @media (max-width: 400px) {
            :root {
                --slab-w: min(285px, 86vw);
                --slab-d: min(260px, 78vw);
                --slab-h: 66px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .sculpture-column, .slab {
                will-change: auto;
            }
        }
    </style>
</head>
<body>
    <div class="black-fade-overlay"></div>

    <header class="top-nav-group">
        <a href="./?return=true" class="back-btn">retour</a>
    </header>

    <main class="scroll-container" id="scroll-container">
        <div class="stage-viewport" aria-hidden="false">
            <div class="stage-world">
                <section class="sculpture-column" id="sculpture-column" aria-label="Writing and publication slabs stack"></section>
            </div>
        </div>
        <section class="safari-library" aria-label="Writing library">
            <ol class="safari-library-list" id="safari-library-list"></ol>
        </section>
    </main>


    <script>
        const works = [
            { title: "portfolio 2026", file: "portfolio_eliott-atom.pdf", available: true },
            { title: "furniture portfolio", file: "furniture-portfolio.pdf", available: true },
            { title: "final presentation ALICE", file: "ALICE-chantier.pdf", available: false },
            { title: "urbanisme versoix", file: "versoix-transition.pdf", available: true },
            { title: "transect (1/3)", file: "a-time-travellers-guide-through-space-time.pdf", available: true },
            { title: "transect (2/3)", file: "transect-90.pdf", available: true },
            { title: "transect (3/3)", file: "zoom-study.pdf", available: true },
            { title: "Speco: We Are Specialists, Not Generalists", file: "speco-we-are-specialists.pdf", available: true },
            { title: "figuration graphique booklet", file: "croubalian-maire-booklet.pdf", available: true },
            { title: "Virtual Architects of the Digital Commons", file: "virtual-architects-digital-commons.pdf", available: true },
            { title: "far 2022 programme", file: "far-2022-programme.pdf", available: true },
            { title: "Architecture project board", file: "architecture-project-board.pdf", available: true },
            { title: "Unbuilding Normativity", file: "unbuilding-normativity.pdf", available: true },
            { title: "Art Fundament", file: "art-fundament.pdf", available: true },
            { title: "Architectural sketches", file: "architectural-sketches.pdf", available: true },
            { title: "Intermission in the Garden", file: "intermission-in-the-garden.pdf", available: true },
            
        ];

        const isSafariBrowser = /safari/i.test(navigator.userAgent)
            && !/chrome|crios|android|fxios|edgios/i.test(navigator.userAgent);

        if (isSafariBrowser) {
            document.documentElement.classList.add("is-safari");
            const safariLibrary = document.getElementById("safari-library-list");

            works.forEach((work) => {
                const item = document.createElement("li");
                item.className = "safari-library-item";

                if (work.available) {
                    const link = document.createElement("a");
                    link.className = "safari-library-link";
                    link.href = `reader.html?file=${encodeURIComponent(work.file)}&title=${encodeURIComponent(work.title)}`;
                    link.textContent = work.title;
                    link.setAttribute("aria-label", `Open ${work.title}`);
                    item.appendChild(link);
                } else {
                    const unavailable = document.createElement("span");
                    unavailable.className = "safari-library-unavailable";
                    unavailable.textContent = work.title;
                    unavailable.setAttribute("aria-disabled", "true");
                    item.appendChild(unavailable);
                }

                safariLibrary.appendChild(item);
            });
        }

        if (!isSafariBrowser) {
        // 20-degree progressive rotation per slab in the pile
        const ANGLE_STEP = 20;

        // Subtle unaxed misalignment offsets (in px)
        const MISALIGN = [
            { x: 0,   z: 0 },
            { x: 10,  z: -8 },
            { x: -12, z: 10 },
            { x: 8,   z: 12 },
            { x: -10, z: -10 },
            { x: 12,  z: 6 },
            { x: -14, z: 8 },
            { x: 10,  z: -12 },
            { x: -8,  z: 14 },
            { x: 12,  z: -6 },
            { x: -10, z: 10 },
            { x: 8,   z: -8 },
            { x: -12, z: 6 },
            { x: 10,  z: 10 },
            { x: -6,  z: -12 },
            { x: 12,  z: 8 },
            { x: -8,  z: 6 }
        ];

        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const columnEl = document.getElementById("sculpture-column");
        const scrollContainer = document.getElementById("scroll-container");
        const counterEl = document.getElementById("scroll-counter");
        const EMPTY_SLABS = 6;

        let slabH = 88;
        let scrollTravelPerSlab = 250;
        let totalScrollDist = (works.length - 1) * scrollTravelPerSlab;
        let slabElements = [];
        let titleElements = [];
        let layoutViewportWidth = window.innerWidth;
        let layoutViewportHeight = window.innerHeight;
        let layoutOrientation = window.innerWidth > window.innerHeight ? "landscape" : "portrait";

        // Build the solid monolithic pile of slabs
        works.forEach((work, index) => {
            const slab = document.createElement("article");
            slab.className = `slab ${work.available ? "is-available" : "is-unavailable"}`;
            slab.dataset.index = index;

            // Slab base angle in the pile: index * 20 degrees
            const baseRot = index * ANGLE_STEP;
            slab.style.setProperty("--slab-base-rot", `${baseRot}deg`);

            const offset = MISALIGN[index % MISALIGN.length];
            slab.style.setProperty("--slab-x", `${offset.x}px`);
            slab.style.setProperty("--slab-z", `${offset.z}px`);

            const anchorTag = work.available ? "a" : "div";
            const anchor = document.createElement(anchorTag);
            anchor.className = "slab-anchor";

            if (work.available) {
                anchor.href = `reader.html?file=${encodeURIComponent(work.file)}&title=${encodeURIComponent(work.title)}`;
                anchor.setAttribute("aria-label", `Open ${work.title}`);
            } else {
                anchor.setAttribute("aria-disabled", "true");
                anchor.setAttribute("role", "region");
                anchor.setAttribute("aria-label", `${work.title} (unavailable)`);
                anchor.title = "Coming soon";
            }

            const box = document.createElement("div");
            box.className = "slab-box";

            // Front face (with title filling to the brim, NO numberer)
            const front = document.createElement("div");
            front.className = "slab-face slab-front";

            const title = document.createElement("div");
            title.className = "slab-title";
            title.textContent = work.title;

            if (!work.available) {
                const badge = document.createElement("span");
                badge.className = "slab-badge";
                badge.textContent = "coming soon";
                front.append(title, badge);
            } else {
                front.appendChild(title);
            }

            titleElements.push(title);

            // Volumetric faces without individual borders
            const topFace = document.createElement("div");
            topFace.className = "slab-face slab-top";
            topFace.setAttribute("aria-hidden", "true");

            const bottomFace = document.createElement("div");
            bottomFace.className = "slab-face slab-bottom";
            bottomFace.setAttribute("aria-hidden", "true");

            const rightFace = document.createElement("div");
            rightFace.className = "slab-face slab-right";
            rightFace.setAttribute("aria-hidden", "true");

            const leftFace = document.createElement("div");
            leftFace.className = "slab-face slab-left";
            leftFace.setAttribute("aria-hidden", "true");

            const backFace = document.createElement("div");
            backFace.className = "slab-face slab-back";
            backFace.setAttribute("aria-hidden", "true");

            box.append(front, topFace, bottomFace, rightFace, leftFace, backFace);
            anchor.appendChild(box);
            slab.appendChild(anchor);
            columnEl.appendChild(slab);
            slabElements.push(slab);
        });

        // Continue the same physical stack above and below the document slabs.
        const firstWorkSlab = slabElements[0];
        const emptySlabTemplate = firstWorkSlab.cloneNode(true);
        emptySlabTemplate.className = "slab is-empty";
        const templateAnchor = emptySlabTemplate.querySelector(".slab-anchor");
        const emptyAnchor = document.createElement("div");
        emptyAnchor.className = "slab-anchor";
        emptyAnchor.setAttribute("aria-hidden", "true");
        emptyAnchor.appendChild(emptySlabTemplate.querySelector(".slab-box"));
        emptySlabTemplate.replaceChild(emptyAnchor, templateAnchor);
        emptySlabTemplate.querySelector(".slab-title")?.remove();
        emptySlabTemplate.querySelector(".slab-badge")?.remove();

        const emptyTopSlabs = [];
        for (let index = -EMPTY_SLABS; index < 0; index++) {
            const slab = emptySlabTemplate.cloneNode(true);
            slab.dataset.index = index;
            slab.style.setProperty("--slab-base-rot", `${index * ANGLE_STEP}deg`);
            const offset = MISALIGN[(index + MISALIGN.length) % MISALIGN.length];
            slab.style.setProperty("--slab-x", `${offset.x}px`);
            slab.style.setProperty("--slab-z", `${offset.z}px`);
            emptyTopSlabs.push(slab);
        }

        const emptyBottomSlabs = [];
        for (let index = works.length; index < works.length + EMPTY_SLABS; index++) {
            const slab = emptySlabTemplate.cloneNode(true);
            slab.dataset.index = index;
            slab.style.setProperty("--slab-base-rot", `${index * ANGLE_STEP}deg`);
            const offset = MISALIGN[index % MISALIGN.length];
            slab.style.setProperty("--slab-x", `${offset.x}px`);
            slab.style.setProperty("--slab-z", `${offset.z}px`);
            emptyBottomSlabs.push(slab);
        }

        emptyTopSlabs.reverse().forEach((slab) => {
            columnEl.insertBefore(slab, columnEl.firstChild);
        });
        emptyBottomSlabs.forEach((slab) => columnEl.appendChild(slab));
        slabElements = [...emptyTopSlabs, ...slabElements, ...emptyBottomSlabs];

        // Auto-scale typography to fill each fixed cube to the brim
        function autoFitTitles() {
            const isMobile = window.innerWidth <= 768;
            const maxFont = isMobile ? 26 : 36;
            const minFont = isMobile ? 12 : 14;

            titleElements.forEach((el) => {
                const parent = el.parentElement;
                const maxWidth = parent.clientWidth - (isMobile ? 18 : 28);
                const maxHeight = parent.clientHeight - (isMobile ? 12 : 16);

                let low = minFont;
                let high = maxFont;
                let best = minFont;

                // Binary search for maximum font size filling the face to the brim
                for (let step = 0; step < 8; step++) {
                    const mid = (low + high) / 2;
                    el.style.fontSize = `${mid}px`;
                    if (el.scrollWidth <= maxWidth && el.scrollHeight <= maxHeight) {
                        best = mid;
                        low = mid + 0.5;
                    } else {
                        high = mid - 0.5;
                    }
                }
                el.style.fontSize = `${best.toFixed(1)}px`;
            });
        }

        function updateMetrics() {
            const isMobile = window.innerWidth <= 768;
            const isTiny = window.innerWidth <= 400;
            slabH = isTiny ? 66 : (isMobile ? 74 : 88);
            scrollTravelPerSlab = isMobile ? 210 : 250;
            totalScrollDist = (works.length - 1) * scrollTravelPerSlab;

            scrollContainer.style.height = `${layoutViewportHeight + totalScrollDist}px`;

            // Every cube touches directly and has exactly the same vertical pitch
            slabElements.forEach((slab, i) => {
                slab.style.setProperty("--slab-y", `${(i - EMPTY_SLABS) * slabH}px`);
            });

            autoFitTitles();
        }

        let ticking = false;

        function updateScroll() {
            const scrollY = window.scrollY || window.pageYOffset || 0;
            const progress = totalScrollDist > 0 ? Math.min(1, Math.max(0, scrollY / totalScrollDist)) : 0;
            const targetIndex = progress * (works.length - 1);

            // 1. Column goes UP as you scroll down
            const columnY = -targetIndex * slabH;
            columnEl.style.setProperty("--column-y", `${columnY.toFixed(2)}px`);

            // 2. Entire column ROTATES as you scroll down
            const columnRotY = prefersReducedMotion ? 0 : -targetIndex * ANGLE_STEP;
            columnEl.style.setProperty("--column-rot-y", `${columnRotY.toFixed(2)}deg`);

            // Bottom-right counter
            const activeIndex = Math.min(works.length, Math.max(1, Math.round(targetIndex) + 1));
            if (counterEl) {
                counterEl.textContent = `${String(activeIndex).padStart(2, "0")} / ${String(works.length).padStart(2, "0")}`;
            }

            ticking = false;
        }

        function requestScrollUpdate() {
            if (!ticking) {
                requestAnimationFrame(updateScroll);
                ticking = true;
            }
        }

        window.addEventListener("scroll", requestScrollUpdate, { passive: true });
        window.addEventListener("resize", () => {
            const nextOrientation = window.innerWidth > window.innerHeight ? "landscape" : "portrait";
            const widthChanged = Math.abs(window.innerWidth - layoutViewportWidth) > 1;
            const orientationChanged = nextOrientation !== layoutOrientation;

            // Safari resizes innerHeight while its URL bar expands/collapses.
            // Keep the scroll geometry stable unless the layout width/orientation changes.
            if (widthChanged || orientationChanged) {
                layoutViewportWidth = window.innerWidth;
                layoutViewportHeight = window.innerHeight;
                layoutOrientation = nextOrientation;
                updateMetrics();
            }
            requestScrollUpdate();
        }, { passive: true });

        // Initial setup
        updateMetrics();
        updateScroll();
        }
    </script>
</body>
</html>
